<style>

:root[data-theme="dark"]{
  --bg:#0e1219; --panel:#151a23; --panel2:#1a202b; --ink:#e6eaf1; --muted:#97a1b2; --line:#283041;
  --accent:#7b9bff; --accent-soft:rgba(123,155,255,.14); --amber:#f0aa3a; --amber-soft:rgba(240,170,58,.14);
  --good:#41c184; --bad:#ff6f6f; --warn:#f0b54a; --good-soft:rgba(65,193,132,.14); --bad-soft:rgba(255,111,111,.13);
  --c-scalp:#a585ff; --c-ict:#f06aae; --c-intraday:#6fa6ff; --c-swing:#3cc7b4; --c-trend:#ff9a4d; --c-quant:#5fc3ea; --c-event:#e0b04a; --c-invest:#9ccc4f; color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
a{ color:var(--accent); text-decoration:none; } a:hover{ text-decoration:underline; }
button,select,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
h1,h2,h3{ font-family:var(--f-display); font-stretch:88%; letter-spacing:-.01em; text-wrap:balance; margin:0; line-height:1.15; }
h1{ font-size:30px; font-weight:750; } h2{ font-size:20px; font-weight:700; } h3{ font-size:15px; font-weight:700; }
.num,.mono,td.n,th.n{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--muted); } .good{ color:var(--good); } .bad{ color:var(--bad); } .amber{ color:var(--amber); }
.lapp{ display:grid; grid-template-columns:228px 1fr; grid-template-rows:auto 1fr; min-height:100%; }
.ltop{ grid-column:1 / -1; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
.lbrand{ display:flex; align-items:baseline; gap:10px; }
.lbrand b{ font-family:var(--f-display); font-stretch:80%; font-weight:800; font-size:21px; letter-spacing:-.02em; }
.lbrand span{ font-size:12px; color:var(--muted); }
@media (max-width:1560px){ .lbrand span{ display:none; } }
.clock{ display:flex; gap:12px; align-items:center; font-family:var(--f-mono); font-size:13px; flex-wrap:wrap; }
.clock .px{ font-weight:500; }
.ctrl{ margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn{ border:1px solid var(--line); background:var(--panel2); border-radius:6px; padding:6px 12px; cursor:pointer; font-weight:500; display:inline-flex; gap:6px; align-items:center; }
.btn:hover{ border-color:var(--accent); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.small{ padding:3px 9px; font-size:12.5px; }
.btn.danger{ border-color:var(--bad); color:var(--bad); }
select,input[type=number],input[type=text]{ border:1px solid var(--line); background:var(--panel2); border-radius:6px; padding:5px 8px; }
.lnav{ border-right:1px solid var(--line); background:var(--panel); padding:14px 10px; position:sticky; top:53px; height:calc(100vh - 53px); overflow:auto; }
.lnav a{ display:flex; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:6px; color:var(--ink); font-weight:500; }
.lnav a:hover{ background:var(--panel2); text-decoration:none; }
.lnav a.on{ background:var(--accent-soft); color:var(--accent); }
.lnav .grp{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:14px 10px 4px; }
.lnav .cnt{ font-family:var(--f-mono); font-size:12px; color:var(--muted); }
.lnav .note{ font-size:12px; color:var(--muted); padding:16px 10px; }
main{ padding:20px 24px 60px; min-width:0; }
.page-h{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.page-h p{ margin:6px 0 0; color:var(--muted); max-width:72ch; }
.grid{ display:grid; gap:14px; }
.g4{ grid-template-columns:repeat(4, minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3, minmax(0,1fr)); } .g2{ grid-template-columns:repeat(2, minmax(0,1fr)); }
.g21{ grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; min-width:0; }
.card > h3{ margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.card > h3 small{ font-family:var(--f-body); font-weight:400; font-size:12px; color:var(--muted); font-stretch:100%; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px; }
.kv dt{ color:var(--muted); } .kv dd{ margin:0; text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.big{ font-family:var(--f-mono); font-size:24px; font-weight:500; font-variant-numeric:tabular-nums; }
.ltile{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px; }
.ltile .l{ font-size:12px; color:var(--muted); } .ltile .v{ font-family:var(--f-mono); font-size:19px; font-variant-numeric:tabular-nums; }
.ltiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:20px; background:var(--panel2); border:1px solid var(--line); white-space:nowrap; }
.chip i{ width:7px; height:7px; border-radius:50%; display:inline-block; }
.chip.good{ background:var(--good-soft); border-color:transparent; color:var(--good); }
.chip.bad{ background:var(--bad-soft); border-color:transparent; color:var(--bad); }
.chip.amber{ background:var(--amber-soft); border-color:transparent; color:var(--amber); }
.chip.acc{ background:var(--accent-soft); border-color:transparent; color:var(--accent); }
.grade{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; font-family:var(--f-mono); font-weight:600; font-size:12px; }
.grade.A{ background:var(--good); color:#fff; } .grade.B{ background:var(--good-soft); color:var(--good); } .grade.C{ background:var(--panel2); color:var(--muted); border:1px solid var(--line); } .grade.D{ background:var(--bad); color:#fff; }
.tbl-wrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:13px; }
th{ text-align:left; font-weight:600; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--panel); }
th.sort{ cursor:pointer; } th.sort:hover{ color:var(--ink); } th.on{ color:var(--accent); }
td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:0; }
td.n,th.n{ text-align:right; } td.mono{ white-space:nowrap; }
tr.click{ cursor:pointer; } tr.click:hover td{ background:var(--panel2); }
tr.shadow td{ opacity:.55; }
.sname{ display:flex; flex-direction:column; gap:2px; }
.sname b{ font-weight:600; }
.cv{ width:100%; display:block; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; margin-top:8px; }
.legend span{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; } .legend i{ width:14px; height:3px; border-radius:2px; display:inline-block; }
.legend span.off{ opacity:.35; }
.feed{ display:flex; flex-direction:column; gap:8px; }
.feed .it{ display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:start; padding-bottom:8px; border-bottom:1px solid var(--line); }
.feed .it:last-child{ border-bottom:0; }
.feed .it p{ margin:2px 0 0; font-size:12.5px; color:var(--muted); }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button{ border:0; background:var(--panel2); padding:4px 10px; cursor:pointer; font-size:12.5px; }
.seg button.on{ background:var(--accent); color:#fff; }
.filters{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.filters .chip{ cursor:pointer; } .filters .chip.on{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.scards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; }
.scard{ background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--cc, var(--accent)); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:8px; color:var(--ink); }
.scard:hover{ border-color:var(--cc); text-decoration:none; }
.scard p{ margin:0; font-size:13px; color:var(--muted); }
.scard .row{ display:flex; gap:12px; font-family:var(--f-mono); font-size:12.5px; flex-wrap:wrap; }
.prose{ max-width:76ch; } .prose p, .prose li{ font-size:14.5px; } .prose li{ margin:4px 0; }
.prose h2{ margin:26px 0 8px; } .prose h3{ margin:18px 0 6px; }
ol.steps{ counter-reset:s; list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
ol.steps li{ counter-increment:s; display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; }
ol.steps li::before{ content:counter(s); font-family:var(--f-mono); font-weight:500; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:12.5px; }
ul.rules{ margin:0; padding-left:18px; } ul.rules li{ margin:4px 0; }
.lflow{ display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; }
.lflow .st{ flex:1 1 140px; background:var(--panel2); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; position:relative; }
.lflow .st b{ display:block; font-family:var(--f-display); font-stretch:88%; font-size:15px; margin-bottom:3px; }
.lflow .st span{ font-size:12.5px; color:var(--muted); }
.lflow .st em{ font-style:normal; font-family:var(--f-mono); font-size:11px; color:var(--accent); }
.note-box{ border-left:3px solid var(--amber); background:var(--amber-soft); padding:10px 14px; border-radius:0 var(--r) var(--r) 0; font-size:13.5px; }
.warn-box{ border-left:3px solid var(--bad); background:var(--bad-soft); padding:10px 14px; border-radius:0 var(--r) var(--r) 0; font-size:13.5px; }
.ins{ display:flex; flex-direction:column; gap:6px; } .ins div{ display:grid; grid-template-columns:16px 1fr; gap:8px; font-size:13px; }
.ins .dot{ width:9px; height:9px; border-radius:50%; margin-top:6px; background:var(--muted); } .ins .good .dot{ background:var(--good); } .ins .warn .dot{ background:var(--bad); }
.toc{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 18px; }
.sec{ margin-top:18px; }
.switch{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.switch input{ margin-top:4px; width:16px; height:16px; accent-color:var(--accent); }
.switch b{ display:block; font-weight:600; } .switch span{ font-size:12.5px; color:var(--muted); }
.pbar{ height:6px; background:var(--panel2); border-radius:4px; overflow:hidden; } .pbar i{ display:block; height:100%; background:var(--accent); }
.scn{ font-size:13px; background:var(--panel2); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; }
.scn b{ font-weight:600; }
#loading{ position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:100; }
#loading .box{ width:min(460px, 90vw); display:flex; flex-direction:column; gap:12px; }
#loading .pbar{ height:8px; }
.foot{ margin-top:34px; font-size:12px; color:var(--muted); max-width:90ch; }
details summary{ cursor:pointer; font-weight:600; }
textarea{ width:100%; min-height:120px; font-family:var(--f-mono); font-size:12px; border:1px solid var(--line); background:var(--panel2); border-radius:6px; padding:8px; color:var(--ink); }
.drop{ border:2px dashed var(--line); border-radius:var(--r); padding:22px; text-align:center; background:var(--panel2); }
.drop.on{ border-color:var(--accent); background:var(--accent-soft); }
@media (max-width: 1100px){ .g4{ grid-template-columns:repeat(2, minmax(0,1fr)); } .g21{ grid-template-columns:1fr; } .g3{ grid-template-columns:1fr 1fr; } }
@media (max-width: 760px){
  .lapp{ grid-template-columns:1fr; }
  .lnav{ position:static; height:auto; display:flex; overflow-x:auto; gap:4px; padding:6px 10px; border-right:0; border-bottom:1px solid var(--line); }
  .lnav .grp, .lnav .note{ display:none; } .lnav a{ white-space:nowrap; } .lnav .cnt{ display:none; }
  main{ padding:14px 16px 50px; } .g4,.g3,.g2{ grid-template-columns:1fr; } .ctrl{ margin-left:0; } h1{ font-size:24px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* ===== Vlastní vzhled: laboratoř – mátově tyrkysová, limetková, milimetrový papír ===== */
:root,:root[data-theme="dark"]{
  --bg:#04090A; --panel:rgba(12,22,24,.66); --panel2:rgba(255,255,255,.045); --ink:#E6F3EF; --muted:#8CA39D; --line:rgba(120,240,210,.12);
  --accent:#4FE3C1; --accent-soft:rgba(79,227,193,.14); --amber:#FFB547; --amber-soft:rgba(255,181,71,.14);
  --good:#45D483; --bad:#FF5D73; --warn:#FFB547; --good-soft:rgba(69,212,131,.14); --bad-soft:rgba(255,93,115,.14);
  --c-scalp:#B794F6; --c-ict:#F472B6; --c-intraday:#60A5FA; --c-swing:#4FE3C1; --c-trend:#FB923C; --c-quant:#67E8F9; --c-event:#FACC15; --c-invest:#A3E635;
  --grid:rgba(79,227,193,.045); --glow1:rgba(79,227,193,.13); --glow2:rgba(163,230,53,.08);
  --grad:linear-gradient(135deg,#4FE3C1,#A3E635); --on-grad:#04110D;
  --f-display:'Space Grotesk', system-ui, sans-serif; --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --f-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r:14px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F6F2; --panel:rgba(255,255,255,.78); --panel2:rgba(10,60,48,.04); --ink:#0D1B17; --muted:#56685F; --line:rgba(10,70,55,.13);
  --accent:#0E8C70; --accent-soft:rgba(14,140,112,.11); --amber:#B86E00; --amber-soft:rgba(184,110,0,.11);
  --good:#0B8A4B; --bad:#C8324A; --warn:#A46A10; --good-soft:rgba(11,138,75,.11); --bad-soft:rgba(200,50,74,.10);
  --c-scalp:#7C4DDB; --c-ict:#C43C83; --c-intraday:#1D6FD6; --c-swing:#0C8F80; --c-trend:#C2620F; --c-quant:#1F7FA8; --c-event:#8A6200; --c-invest:#4B7A12;
  --grid:rgba(14,140,112,.07); --glow1:rgba(14,140,112,.10); --glow2:rgba(132,204,22,.10);
  --grad:linear-gradient(135deg,#0E8C70,#65A30D); --on-grad:#fff; color-scheme:light;
}
body{font-size:14.5px;background:
  radial-gradient(1100px 620px at 88% -12%,var(--glow1),transparent 62%),
  radial-gradient(900px 520px at -8% 108%,var(--glow2),transparent 60%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
  var(--bg);background-attachment:fixed}
h1,h2,h3,.lbrand b,.lflow .st b{font-stretch:100%;letter-spacing:-.02em}
h1{font-size:clamp(26px,3vw,34px);font-weight:700}h2{font-weight:600}h3{font-weight:600}
.card,.ltile,.scard,.ltop,.lnav,.lflow .st{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -18px rgba(0,0,0,.6)}
:root[data-theme="light"] .card{box-shadow:0 10px 30px -22px rgba(10,60,48,.35)}
.lapp{grid-template-columns:250px 1fr;gap:14px;padding:12px;min-height:100vh}
.ltop{position:sticky;top:12px;border:1px solid var(--line);border-radius:18px;padding:10px 16px;background:var(--panel)}
.lbrand{align-items:center}

td.n{white-space:nowrap}

.lnav a.on{background:var(--accent-soft);color:var(--ink);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.lnav .grp{color:var(--accent);font-weight:600;letter-spacing:.12em}
main{padding:6px 6px 60px}
.btn{border-radius:99px;padding:7px 15px;background:var(--panel2)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--on-grad);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{border-radius:99px}
.seg{border-radius:99px}.seg button.on{background:var(--grad);color:var(--on-grad)}

.chip{border-radius:99px}
.scard{border-left-width:3px}

.ltile{border-radius:12px}
.big,.ltile .v{font-weight:600}
.lflow .st{border-radius:12px}
.note-box,.warn-box{border-radius:0 12px 12px 0}
.themebtn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:99px;width:36px;height:34px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.themebtn:hover{border-color:var(--accent)}
#loading{background:var(--bg)}

/* ---------- Sandbox backtest ---------- */
class Runner {
  constructor(eng, def, p, a, b){ this.e = eng; this.def = def; this.R = eng.makeRuntime(def, p, true); this.k = a; this.b = b; this.a = a; this.lastDay = -1; }
  step(n){
    const e = this.e, R = this.R, W = e.W;
    if (this.def.intra){
      const M = W.m1;
      for (let c = 0; c < n && this.k < this.b; c++, this.k++){ if (!M.has(this.k)) continue; const d = M.X('Dd', this.k);
        if (this.lastDay >= 0 && d !== this.lastDay){ R.acc.eqD.push(this.lastDay); R.acc.eqV.push(e.equity(R)); } this.lastDay = d; e.intraBar(R, this.k); }
      if (this.k >= this.b){ for (const L of R.acc.lots.slice()) e.closeLot(R, L, R.curPx.NQ, this.b - 1, 'END'); R.acc.eqD.push(this.lastDay); R.acc.eqV.push(e.equity(R)); return true; }
      return false;
    }
    for (let c = 0; c < n && this.k < this.b; c++, this.k++) e.dayBar(R, this.k);
    if (this.k >= this.b){ for (const L of R.acc.lots.slice()) e.closeLot(R, L, W.daily[L.sym].c(this.b - 1), this.b - 1, 'END'); return true; }
    return false;
  }
  result(){ return scoreRun(this.R, this.def); }
}
function scoreRun(R, def){
  const T = R.acc.trades, minN = def.minTrades || (def.intra ? 6 : 8);
  const res = { n: T.length, minN };
  if (def.kind === 'trade'){
    const Rs = T.filter(t => t.R !== null).map(t => t.R); res.n = Rs.length;
    res.expR = mean(Rs); const sd = stdev(Rs); res.sqn = Rs.length > 1 && sd > 0 ? res.expR/sd*Math.sqrt(Math.min(Rs.length, 50)) : 0;
    res.score = Rs.length < minN ? -3 + Rs.length/minN : res.sqn; res.win = Rs.length ? Rs.filter(x => x > 0).length/Rs.length : 0;
  } else {
    const V = R.acc.eqV, rets = []; for (let k = 1; k < V.length; k++) rets.push(V[k]/V[k-1] - 1);
    const sd = stdev(rets), sh = sd > 0 ? mean(rets)/sd*Math.sqrt(252) : 0; let pk = -Infinity, mdd = 0; for (const v of V){ pk = Math.max(pk, v); mdd = Math.max(mdd, 1 - v/pk); }
    res.sharpe = sh; res.mdd = mdd; res.ret = V.length ? V[V.length-1]/V[0] - 1 : 0; res.score = sh - 2.5*Math.max(0, mdd - 0.2); res.n = Math.max(T.length, 99);
  }
  return res;
}

/* ---------- Statistiky účtu ---------- */
function acctStats(R){
  const A = R.acc, T = A.trades.filter(t => !t.shadow), Rs = T.filter(t => t.R !== null).map(t => t.R);
  const wins = T.filter(t => t.pnl > 0), gw = sum(wins.map(t => t.pnl)), gl = -sum(T.filter(t => t.pnl <= 0).map(t => t.pnl));
  const V = A.eqV, rets = []; for (let k = 1; k < V.length; k++) rets.push(V[k]/V[k-1] - 1);
  const sd = stdev(rets), sharpe = sd > 0 ? mean(rets)/sd*Math.sqrt(252) : 0; let pk = -Infinity, mdd = 0; for (const v of V){ pk = Math.max(pk, v); mdd = Math.max(mdd, 1 - v/pk); }
  const eq = V.length ? V[V.length-1] : A.start, days = V.length, yrs = days/252, ret = eq/A.start - 1;
  const sdR = stdev(Rs), expR = Rs.length ? mean(Rs) : null;
  return { n: T.length, shadow: A.trades.length - T.length, win: T.length ? wins.length/T.length : null, pf: gl > 0 ? gw/gl : (gw > 0 ? Infinity : null), expR, sqn: Rs.length >= 5 && sdR > 0.05 ? expR/sdR*Math.sqrt(Math.min(Rs.length, 100)) : null,
    eq, ret, cagr: yrs > 0.5 ? Math.pow(Math.max(eq, 1)/A.start, 1/yrs) - 1 : null, sharpe, mdd, days, open: A.lots.filter(l => !l.shadow).length, openShadow: A.lots.filter(l => l.shadow).length };
}

/* ---------- Automatické vyhodnocení obchodu ---------- */
const XR_NAMES = { TP:'cíl', SL:'stop-loss', BE:'stop na BE', TP1:'částečný cíl', TIME:'časový stop', EOD:'konec seance', SIG:'signál k výstupu', REBAL:'rebalance', OPEN:'ziskové otevření', END:'konec testu', FLIP:'otočení' };
function reviewTrade(t, def, W){
  const tags = [], notes = []; let grade;
  if (t.R !== null){
    if (t.R >= 2) grade = 'A'; else if (t.R > 0) grade = 'B'; else if (t.R >= -1.15) grade = 'C'; else grade = 'D';
    if (t.R <= 0 && t.mfeR >= 1){ tags.push('vrácený zisk'); notes.push('Obchod byl ' + nf(t.mfeR,1) + 'R v zisku a skončil ' + (t.R < 0 ? 'ztrátou' : 'na nule') + '. Pomohl by posun stopu na BE po +1R.'); }
    if (t.R > 0 && t.maeR >= 0.8){ tags.push('těsný stop'); notes.push('Obchod šel ' + nf(t.maeR,1) + 'R proti mně, než vydělal. Stop byl na hraně.'); }
    if (t.R > 0 && t.maeR !== null && t.maeR < 0.2){ tags.push('čistý vstup'); }
    if (grade === 'C') notes.push('Ztráta v plánovaném riziku. Podle Marka Douglase je to náklad podnikání, ne chyba.');
    if (grade === 'D') notes.push('Ztráta větší než plán (gap nebo skluz přes stop).');
  } else { grade = t.pnl > 0 ? 'B' : 'C'; }
  const c = t.ctx;
  if (c){
    if ((t.side > 0 && c.trend === 'býčí') || (t.side < 0 && c.trend === 'medvědí')) tags.push('s denním trendem');
    else if ((t.side > 0 && c.trend === 'medvědí') || (t.side < 0 && c.trend === 'býčí')) tags.push('proti dennímu trendu');
    if (c.senti === 'strach' && t.side > 0) tags.push('nákup ve strachu');
    if (c.senti === 'chamtivost' && t.side > 0) tags.push('nákup v euforii');
    if (c.macro === 'zpomalení' && t.side > 0) tags.push('proti makru');
    if (c.learn) tags.push('učení (málo dat)');
  }
  if (t.shadow) tags.push('stínový obchod');
  const xr = XR_NAMES[t.xr] || t.xr;
  const verdict = grade + ' · ' + (t.R !== null ? fR(t.R) : spct(t.ret)) + ' · ' + xr + (t.shadow ? ' · filtr EV ho zablokoval' : '');
  return { grade, tags, notes, verdict };
}

/* ---------- Postřehy strategie (co se naučila z obchodů) ---------- */
function insights(R){
  const T = R.acc.trades.filter(t => t.R !== null), out = [];
  if (T.length < 10) return [{ k: 'info', t: 'Zatím méně než 10 obchodů s R. Postřehy přibudou s dalšími daty, protože malý vzorek je náhoda.' }];
  const losers = T.filter(t => t.R <= 0), winners = T.filter(t => t.R > 0);
  const gaveBack = losers.filter(t => t.mfeR >= 1).length / Math.max(1, losers.length);
  if (gaveBack > 0.3) out.push({ k: 'warn', t: Math.round(gaveBack*100) + ' % ztrátových obchodů bylo nejdřív aspoň +1R v zisku. Pravidlo „po +1R stop na BE“ by tu pomohlo.' });
  const maeW = mean(winners.map(t => t.maeR || 0));
  if (winners.length >= 5) out.push({ k: maeW < 0.4 ? 'good' : 'info', t: 'Vítězné obchody šly v průměru jen ' + nf(maeW, 2) + 'R proti pozici' + (maeW < 0.4 ? ', vstupy jsou přesné.' : '.') });
  for (const dim of ['trend','senti','macro']){
    const g = {}; for (const t of T){ const b = t.ctx && t.ctx[dim]; if (!b) continue; (g[b] = g[b] || []).push(t.R); }
    const ks = Object.keys(g).filter(k => g[k].length >= 5); if (ks.length < 2) continue;
    ks.sort((a,b) => mean(g[b]) - mean(g[a])); const best = ks[0], worst = ks[ks.length-1];
    const nm = { trend:'denní trend', senti:'sentiment', macro:'makro' }[dim];
    out.push({ k: mean(g[worst]) < 0 ? 'warn' : 'info', t: 'Podle ' + nm + 'u: nejlépe „' + best + '“ (' + fR(mean(g[best])) + ', n=' + g[best].length + '), nejhůř „' + worst + '“ (' + fR(mean(g[worst])) + ', n=' + g[worst].length + ').' });
  }
  const L = T.filter(t => t.side > 0), S = T.filter(t => t.side < 0);
  if (L.length >= 5 && S.length >= 5) out.push({ k: 'info', t: 'Long ' + fR(mean(L.map(t => t.R))) + ' (n=' + L.length + ') vs. short ' + fR(mean(S.map(t => t.R))) + ' (n=' + S.length + ').' });
  if (R.def.intra){ const hr = {}; for (const t of T){ const h = Math.floor(t.eK/60); (hr[h] = hr[h] || []).push(t.R); } const hs = Object.keys(hr).filter(h => hr[h].length >= 4);
    if (hs.length >= 2){ hs.sort((a,b) => mean(hr[b]) - mean(hr[a])); out.push({ k: 'info', t: 'Nejlepší hodina vstupu ' + hs[0] + ':00 NY (' + fR(mean(hr[hs[0]])) + '), nejhorší ' + hs[hs.length-1] + ':00 NY (' + fR(mean(hr[hs[hs.length-1]])) + ').' }); } }
  let ms = 0, cs = 0; for (const t of T){ if (t.R <= 0){ cs++; ms = Math.max(ms, cs); } else cs = 0; }
  const p = winners.length / T.length, expStreak = p < 1 ? Math.log(T.length)/Math.log(1/(1-p)) : 0;
  out.push({ k: ms > expStreak*1.6 ? 'warn' : 'good', t: 'Nejdelší série ztrát: ' + ms + '. Při úspěšnosti ' + Math.round(p*100) + ' % a ' + T.length + ' obchodech je statisticky normální zhruba ' + nf(expStreak, 1) + '. Myslet v pravděpodobnostech znamená počítat s tím.' });
  return out;
}

    idea:'V trendu se trh vrací ve dvou nohách. První pokus o obnovení trendu (H1) často selže, druhý (H2) mívá vyšší pravděpodobnost, protože ho vidí víc obchodníků. Brooks skalpuje 5m e-mini s cílem zhruba 1× riziko.',
    rules:['Trend: EMA20 stoupá a aspoň 7 z posledních 10 svíček zavřelo nad ní.','Pullback: svíčka udělá nižší high. Počítají se pokusy (high nad předchozím high).','Na druhém pokusu (H2), když se pullback dotkl EMA20: buy stop 1 tick nad signální svíčku, platí jen další svíčku.','Stop: pod low pullbacku. Cíl: 1R (skalp).','Short (L2) zrcadlově v downtrendu.'],
    basics:['Počítání nohou (H1/H2) je jádro metody. Kdo ho neumí, vidí jen svíčky.','Stop entry znamená, že tě trh musí potvrdit. Když nevezme high signální svíčky, nejsi v obchodě.','Brooks zdůrazňuje „trader’s equation“: pravděpodobnost × zisk musí být větší než (1 − p) × riziko.'],
    fund:'Žádné fundamenty, čistý price action. Den s makro zprávou jen zvyšuje šum.', senti:'Lab sleduje, jestli H2 funguje líp s denním trendem. To je kontext, který Brooks nazývá „always in“.',
    works:'Hladké trendy s pravidelnými pullbacky.', fails:'Range dny (H2 vznikají i v rozpětí a selhávají) a chaotické svíčky.',
    howto:['Graf NQ 5m s EMA20.','Urči „always in“ směr: kde je většina svíček vůči EMA a kam míří.','V pullbacku počítej pokusy: každý high nad předchozím high je další noha. První je H1, druhý H2.','Na H2 u EMA20 dej buy stop nad signální svíčku a stop pod pullback.','Cíl 1R. Když se do 2–3 svíček nic neděje, příkaz zruš.','Projdi 100 historických H2 setupů a spočítej si úspěšnost sám. Bez toho nebudeš mít důvěru je vzít.'] } });

DEF({ id:'news_scalp', name:'Makro news momentum (CPI/NFP/FOMC)', cat:'scalp', tf:'1m', mkts:'NQ', kind:'trade', risk:0.004, minTrades:3,
  params:{
    minBody:{ v:1.5, min:0.6, max:3.0, step:0.1, label:'Min. tělo první svíčky (× ATR30)' },
    stopMode:{ v:'mid', opts:['mid','extreme'], label:'Stop: střed / extrém svíčky' },
    targetR:{ v:2.0, min:1.0, max:4.0, step:0.25, label:'Cíl (R)' },
    timeStop:{ v:15, min:5, max:40, step:5, label:'Časový stop (min)' },
    useSurprise:{ v:true, type:'bool', label:'Směr musí sedět s fundamentem překvapení' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ st.day = x.d; st.done = {}; }
    const evs = x.eventsToday(); if (!evs.length || x.pos()) return;
    for (const ev of evs){
      if (st.done[ev.type] || x.K !== ev.clock) continue; st.done[ev.type] = true;
      const o = x.o(), c = x.c(), h = x.h(), l = x.l(), a = ind(x.W.m1, 'atr', 30, x.j - 1), body = c - o;
      if (!(a > 0) || Math.abs(body) < p.minBody*a) continue;
      const dir = Math.sign(body);
      if (p.useSurprise && ev.z !== null && ev.z !== undefined && (Math.sign(ev.react*ev.z) !== dir || Math.abs(ev.z) < 0.5)) continue;
      const stop = p.stopMode === 'mid' ? (h + l)/2 - dir*NQ_TICK : (dir > 0 ? l - NQ_TICK : h + NQ_TICK);
      const od = { stop, targetR: p.targetR, timeStop: p.timeStop, flat: 955, reason: ev.name + (ev.z !== null && ev.z !== undefined ? ': ' + ev.act + ev.unit + ' vs. očekávání ' + ev.exp + ev.unit + ' (překvapení z=' + nf(ev.z,1) + ')' : ': první minuta s tělem ' + nf(Math.abs(body)/a, 1) + ' × ATR') };
      dir > 0 ? x.buy(od) : x.sell(od);
    }
  },
  info:{ who:'Makro tradeři na CME (index futures kolem ekonomických dat)', src:'Ekonomický kalendář (BLS: CPI, NFP; Fed: FOMC). Reakce futures CME na data', year:null,
    idea:'V 8:30 NY vyjde CPI nebo NFP, ve 14:00 rozhodnutí Fedu. Algoritmy přecení trh během sekund. Když první minuta udělá velké tělo a směr sedí s fundamentem (vyšší inflace je špatná pro akcie), trh v sim. 65 % případů pokračuje.',
    rules:['Obchoduje jen dny s high-impact zprávou: CPI, NFP a FOMC.','Po uzavření první minuty po zprávě: tělo svíčky ≥ 1,5 × ATR(30).','Fundamentální filtr: směr svíčky = znaménko (reakce × překvapení). Vyšší CPI, než trh čekal, dává short.','Stop na středu svíčky. Cíl 2R. Časový stop 15 minut.'],
    basics:['Rozhoduje překvapení (skutečnost minus konsenzus), ne samotné číslo.','Ve zprávách bývá skluz obrovský. Proto stop podle struktury svíčky, ne těsně.','Když trh reaguje proti fundamentu, něco se děje (pozicování). Takový obchod se nebere.'],
    fund:'Jádro strategie: porovnává skutečnou hodnotu s očekáváním a mapuje překvapení na směr akcií (inflace −, zaměstnanost + při nízké inflaci, jestřábí Fed −).', senti:'Kontext dne (trend, F&G) jde do EV filtru.',
    works:'Výrazná překvapení (|z| > 1) v trendových makro obdobích.', fails:'Zprávy v souladu s očekáváním a whipsaw, kdy první svíčka obě strany vystopuje.',
    howto:['Ráno se podívej do ekonomického kalendáře (Forex Factory nebo Investing): čas, konsenzus, předchozí hodnota.','Předem si napiš, co znamená vyšší a nižší číslo pro NQ.','Minutu před zprávou nic nedělej. Spready se roztáhnou.','Po uzavření první minuty ověř velikost těla a soulad s fundamentem.','Vstup trhem, stop na středu svíčky, cíl 2R, max. 15 minut.','Nikdy neobchoduj zprávu s plnou pozicí. Skluz umí udělat ze ztráty 1R ztrátu 2R.'] } });

DEF({ id:'ict_2022', name:'ICT 2022 model (bias → sweep → MSS → FVG)', cat:'ict', tf:'1m', mkts:'NQ', kind:'trade', risk:0.005, minTrades:5,
  params:{
    biasOn:{ v:true, type:'bool', label:'Denní bias z PDH/PDL' },
    useAMD:{ v:true, type:'bool', label:'AMD: long jen pod NY midnight open, short nad' },
    pivLen:{ v:2, min:1, max:4, step:1, label:'Swing pivot 5m (svíčky na stranu)' },
    dispMult:{ v:1.0, min:0.5, max:2.0, step:0.1, label:'Displacement: tělo ≥ ATR ×' },
    sweepMax:{ v:24, min:8, max:48, step:4, label:'MSS do N 5m svíček po sweepu' },
    entryMode:{ v:'FVG', opts:['FVG','Fib'], label:'Vstup: FVG / Fib OTE' },
    fvgCE:{ v:false, type:'bool', label:'FVG: vstup do středu (CE)' },
    fibLvl:{ v:0.705, min:0.62, max:0.79, step:0.005, label:'Fib úroveň OTE' },
    minRR:{ v:2.0, min:1.2, max:3.5, step:0.1, label:'Min. RR k PDH/PDL' },
    fixRR:{ v:2.5, min:1.5, max:4.0, step:0.25, label:'Pevné RR, když je cíl už vybraný' },
    usePartial:{ v:true, type:'bool', label:'TP1 na opačné straně Asie + SL na BE' },
    maxSl:{ v:120, min:40, max:200, step:10, label:'Max. SL (body NQ při 20 000)' },
    london:{ v:true, type:'bool', label:'Obchodovat Londýn (Praha 9:00–11:30)' },
    ny:{ v:true, type:'bool', label:'Obchodovat NY (Praha 15:30–18:00)' },
    maxTrades:{ v:2, min:1, max:3, step:1, label:'Max. obchodů za den' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    const S = x.S;
    if (st.day !== x.d){ st.day = x.d; st.n = 0; st.sw = null; st.kz = null;
      st.bias = !p.biasOn ? 0 : (S.pdc > S.pdMid && S.pdc > S.ppdc) ? 1 : (S.pdc < S.pdMid && S.pdc < S.ppdc) ? -1 : 0; }
    const inL = p.london && x.inWin(180, 330), inN = p.ny && x.inWin(570, 720);
    if (!inL && !inN){ st.sw = null; return; }
    if (st.n >= p.maxTrades || x.pos() || x.orders().length) return;
    const kz = inL ? 'L' : 'N'; if (st.kz !== kz){ st.kz = kz; st.sw = null; }
    if (p.biasOn && st.bias === 0) return;
    const lowLvl = inL ? x.X('asL') : x.X('lnL'), highLvl = inL ? x.X('asH') : x.X('lnH');
    const l = x.l(), h = x.h(), s5 = x.W.s5;
    if (st.bias >= 0 && l < lowLvl && (!st.sw || st.sw.dir !== 1)) st.sw = { dir: 1, ext: l, j: x.j, k5: s5.n, lvl: lowLvl };
    if (st.bias <= 0 && h > highLvl && (!st.sw || st.sw.dir !== -1)) st.sw = { dir: -1, ext: h, j: x.j, k5: s5.n, lvl: highLvl };
    const sw = st.sw; if (!sw) return;
    sw.ext = sw.dir > 0 ? Math.min(sw.ext, l) : Math.max(sw.ext, h);
    if (x.j - sw.j > p.sweepMax*5){ st.sw = null; return; }
    const e5 = x.X('e5'); if (e5 < 0 || e5 < sw.k5) return;
    const a5 = ind(s5, 'atr', 14, e5), piv = pivot5(s5, e5, p.pivLen, sw.dir, 36); if (piv === null) return;
    const c5 = s5.c(e5), o5 = s5.o(e5);
    if (!(sw.dir > 0 ? (c5 > piv && c5 > o5) : (c5 < piv && c5 < o5)) || Math.abs(c5 - o5) < p.dispMult*a5) return;
    let entry;
    if (p.entryMode === 'FVG'){
      let f = null; for (let k = 0; k < 4 && e5 - k - 2 >= s5.base; k++){ const b = e5 - k;
        if (sw.dir > 0 && s5.l(b) > s5.h(b-2)){ f = { top: s5.l(b), bot: s5.h(b-2) }; break; }
        if (sw.dir < 0 && s5.h(b) < s5.l(b-2)){ f = { top: s5.l(b-2), bot: s5.h(b) }; break; } }
      if (!f){ st.sw = null; return; }
      entry = p.fvgCE ? (f.top + f.bot)/2 : (sw.dir > 0 ? f.top : f.bot);
    } else {
      let ext = sw.dir > 0 ? -Infinity : Infinity; for (let b = Math.max(sw.k5, s5.base); b <= e5; b++) ext = sw.dir > 0 ? Math.max(ext, s5.h(b)) : Math.min(ext, s5.l(b));
      entry = sw.dir > 0 ? ext - p.fibLvl*(ext - sw.ext) : ext + p.fibLvl*(sw.ext - ext);
    }
    entry = tick(entry, NQ_TICK);
    const k = sc(x), stop = sw.ext - sw.dir*2*k, risk = Math.abs(entry - stop);
    if (risk < 10*k || risk > p.maxSl*k || sw.dir*(entry - stop) <= 0){ st.sw = null; return; }
    if (p.useAMD && S.nyMid !== null && (sw.dir > 0 ? entry > S.nyMid : entry < S.nyMid)){ st.sw = null; return; }
    const draw = sw.dir > 0 ? S.pdh : S.pdl, rr = sw.dir*(draw - entry)/risk;
    let target; if (rr >= p.minRR) target = draw; else if (rr <= 0) target = entry + sw.dir*p.fixRR*risk; else { st.sw = null; return; }
    let partial = null; if (p.usePartial){ const at = sw.dir > 0 ? x.X('asH') : x.X('asL'); if (isFinite(at) && sw.dir*(at - entry) >= risk && sw.dir*(target - at) > 0) partial = { at, frac: 0.5, be: true }; }
    const od = { type:'limit', price: entry, stop, target, partial, exp: x.j + Math.max(10, (inL ? 330 : 720) - x.t), flat: inL ? 505 : 955,
      reason: 'Sweep ' + (inL ? 'Asie ' : 'Londýna ') + (sw.dir > 0 ? 'low' : 'high') + ' → MSS 5m s displacementem → ' + (p.entryMode === 'FVG' ? (p.fvgCE ? 'FVG CE' : 'FVG') : 'Fib ' + p.fibLvl) + (st.bias ? ', bias ' + (st.bias > 0 ? 'býčí' : 'medvědí') : '') + ', cíl ' + (target === draw ? (sw.dir > 0 ? 'PDH' : 'PDL') : p.fixRR + 'R') };
    sw.dir > 0 ? x.buy(od) : x.sell(od); st.n++; st.sw = null;
  },
  info:{ who:'Michael J. Huddleston (Inner Circle Trader); u nás Veselovský, Kimmel, Můčka', src:'ICT 2022 Mentorship Model (YouTube, 2022)', year:2022,
    idea:'Velcí hráči potřebují likviditu, tedy stopky ostatních. Proto trh v killzóně nejdřív vybere stopky za asijským nebo londýnským low (sweep), pak prudce otočí (displacement) a zlomí strukturu (MSS). Za sebou nechá nevyplněnou mezeru (FVG), do které se vstupuje. Cíl je likvidita na druhé straně (PDH/PDL). Logika odpovídá tvému ICT botu a modelu Veselovský.',
    rules:['Daily bias: včera zavřel nad středem rozpětí a nad předvčerejším close → býčí (long setupy), opačně medvědí.','Killzóny: Londýn 3:00–5:30 NY (Praha 9:00–11:30), New York 9:30–12:00 NY (Praha 15:30–18:00).','Sweep: Londýn bere asijské low/high, NY bere londýnské low/high.','MSS: 5m svíčka zavře za posledním swing pivotem s tělem ≥ 1 × ATR (displacement).','Vstup: limit na hraně FVG (nebo CE / Fib 0,705), platí do konce killzóny. AMD: long jen pod NY midnight open.','SL za extrém sweepu + 2 body. Cíl PDH/PDL, když je RR ≥ 2. Když je už vybraný, pevné 2,5R. TP1 50 % na opačné straně Asie a SL na BE.'],
    basics:['Bez denního biasu je to jen hledání vzorců. Bias říká, kterou likviditu trh chce.','Sweep bez displacementu není setup. Displacement je stopa institucionálního objemu.','Killzóny nejsou dogma, je to čas, kdy je likvidita. Mimo ně se FVG plní náhodně.','Jedna seance = max. 2 obchody. ICT model není kulomet.'],
    fund:'Den s high-impact zprávou mění chování likvidity. Lab měří výsledky ve dnech se zprávami zvlášť (kontext).', senti:'Denní trend a sentiment jdou do EV filtru. Lab se učí, jestli sweepy fungují líp ve strachu, nebo v euforii.',
    works:'Dny s jasným biasem a čistým Judas swingem (falešný pohyb, pak otočka).', fails:'Průrazové dny, kdy sweep není manipulace, ale začátek trendu. V simulaci je to ~30 % pokusů.',
    howto:['Ráno (Praha 8:00) urči bias: kde zavřel včerejšek vůči svému středu a předvčerejšímu close? Kde je PDH a PDL?','Označ asijské high/low (Praha 2:00–8:00) a NY midnight open (Praha 6:00).','V killzóně čekej na vybrání asijského (Londýn) nebo londýnského (NY) extrému proti biasu.','Na 5m čekej na svíčku s velkým tělem, která zavře za posledním swingem. To je MSS.','Najdi FVG v té noze a dej limit na její hranu. SL za extrém sweepu.','TP1 na opačné straně Asie, zbytek na PDH/PDL. Po TP1 SL na BE.','Backtestuj ručně aspoň 3 měsíce (TradingView replay), než to vezmeš živě.'] } });

DEF({ id:'ict_sb', name:'ICT Silver Bullet (10–11 NY)', cat:'ict', tf:'1m', mkts:'NQ', kind:'trade', risk:0.005, minTrades:5,
  params:{
    disp:{ v:1.2, min:0.6, max:2.5, step:0.1, label:'Displacement svíčka ≥ ATR ×' },
    ce:{ v:false, type:'bool', label:'Vstup do CE (středu) FVG' },
    slBuf:{ v:1, min:0, max:4, step:0.5, label:'SL rezerva (body při 20 000)' },
    minRR:{ v:2.0, min:1.0, max:4.0, step:0.25, label:'Min. RR' },
    maxAfter:{ v:15, min:5, max:30, step:5, label:'FVG do N minut po sweepu' },
    timeStop:{ v:120, min:30, max:300, step:30, label:'Časový stop (min)' },
    biasOn:{ v:true, type:'bool', label:'Jen ve směru denního biasu' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ const S = x.S; st.day = x.d; st.done = false; st.sw = null; st.orH = null;
      st.bias = !p.biasOn ? 0 : (S.pdc > S.pdMid && S.pdc > S.ppdc) ? 1 : (S.pdc < S.pdMid && S.pdc < S.ppdc) ? -1 : 0; }
    if (st.done || x.pos() || x.orders().length || !x.inWin(600, 660)) return;
    if (st.orH === null){ st.orH = x.W.m1.X('rtH', x.j - 1); st.orL = x.W.m1.X('rtL', x.j - 1); }
    const a = x.atr(14); if (!(a > 0)) return;
    if (!st.sw){ if (x.l() < st.orL && st.bias >= 0) st.sw = { dir: 1, ext: x.l(), j: x.j }; else if (x.h() > st.orH && st.bias <= 0) st.sw = { dir: -1, ext: x.h(), j: x.j }; return; }
    const sw = st.sw; sw.ext = sw.dir > 0 ? Math.min(sw.ext, x.l()) : Math.max(sw.ext, x.h());
    if (x.j - sw.j > p.maxAfter){ st.sw = null; return; }
    const k = sc(x);
    if (sw.dir > 0 && x.l() > x.h(2) && x.c(1) - x.o(1) >= p.disp*a){
      const entry = tick(p.ce ? (x.l() + x.h(2))/2 : x.l(), NQ_TICK), stop = sw.ext - p.slBuf*k, risk = entry - stop; if (risk < 0.3*a || risk > 8*a) return;
      const target = Math.max(st.orH, entry + p.minRR*risk);
      x.buy({ type:'limit', price: entry, stop, target, timeStop: p.timeStop, exp: x.j + 20, flat: 955, reason: 'Silver Bullet: sweep low 9:30–10:00 range → býčí FVG s displacementem, cíl ' + (target === st.orH ? 'high rozpětí' : p.minRR + 'R') }); st.done = true;
    } else if (sw.dir < 0 && x.h() < x.l(2) && x.o(1) - x.c(1) >= p.disp*a){
      const entry = tick(p.ce ? (x.h() + x.l(2))/2 : x.h(), NQ_TICK), stop = sw.ext + p.slBuf*k, risk = stop - entry; if (risk < 0.3*a || risk > 8*a) return;
      const target = Math.min(st.orL, entry - p.minRR*risk);
      x.sell({ type:'limit', price: entry, stop, target, timeStop: p.timeStop, exp: x.j + 20, flat: 955, reason: 'Silver Bullet: sweep high 9:30–10:00 range → medvědí FVG s displacementem, cíl ' + (target === st.orL ? 'low rozpětí' : p.minRR + 'R') }); st.done = true;
    }
  },
  info:{ who:'Michael J. Huddleston (ICT)', src:'ICT Silver Bullet (2023): časové okno 10:00–11:00 NY', year:2023,
    idea:'Mezi 10:00 a 11:00 NY (Praha 16:00–17:00) algoritmy často dorovnávají nabídku a poptávku po otevření. Silver Bullet čeká, až cena vybere high nebo low prvních 30 minut, pak vznikne FVG s displacementem opačným směrem. Vstupuje se do FVG s cílem na druhou stranu rozpětí.',
    rules:['Okno: 10:00–11:00 NY (Praha 16:00–17:00), jeden obchod denně.','Likvidita: high/low RTH rozpětí 9:30–10:00. Bere se jen strana proti dennímu biasu (long po sweepu low v býčím dni).','Sweep jedné strany, do 15 minut 1m FVG opačným směrem, prostřední svíčka s tělem ≥ 1,2 ATR.','Limit na hraně FVG. SL za extrém sweepu. Cíl na opačné straně rozpětí, minimálně 2R.'],
    basics:['Čas je filtr: mimo okno se setup nebere, ať vypadá jakkoli.','FVG bez předchozího vybrání likvidity je jen mezera, ne setup.','Jeden obchod. Po ztrátě se den nedohání.'],
    fund:'Nepoužívá. Lab ale vidí, jestli den se zprávou v 8:30 mění úspěšnost (kontext).', senti:'Kontext trend/sentiment v EV filtru.',
    works:'Dny, kdy první půlhodina vytvoří jasné rozpětí a pak přijde manipulace.', fails:'Trendové dny bez návratu a dny s FOMC odpoledne.',
    howto:['Na NQ 1m si v 10:00 NY označ high a low od 9:30.','Čekej, až jedna strana bude vybraná.','Hledej tři svíčky, kde prostřední má velké tělo opačným směrem a mezi první a třetí zůstane mezera (FVG).','Limit na hranu FVG, SL za extrém, cíl druhá strana rozpětí (min. 2R).','Po 11:00 už nové obchody nebrat.'] } });

DEF({ id:'orb', name:'Opening Range Breakout (Crabel)', cat:'intraday', tf:'5m', mkts:'NQ', kind:'trade', risk:0.005, minTrades:6,
  params:{
    orMin:{ v:15, opts:[5,15,30], label:'Délka opening range (min)' },
    stopMode:{ v:'mid', opts:['mid','opp'], label:'Stop: střed / druhá strana' },
    targetR:{ v:2.0, min:0, max:4, step:0.5, label:'Cíl (R, 0 = do konce dne)' },
    nr7:{ v:false, type:'bool', label:'Jen po NR7 dni (Crabel)' },
    expiry:{ v:720, opts:[630,690,720,780,840], label:'Příkazy platí do (NY)' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ st.day = x.d; st.placed = false; }
    const orEnd = 570 + p.orMin; if (st.placed || x.t !== orEnd) return; st.placed = true;
    const n = p.orMin/5; let hi = -Infinity, lo = Infinity; for (let k = 0; k < n; k++){ hi = Math.max(hi, x.h(k)); lo = Math.min(lo, x.l(k)); }
    if (p.nr7){ const D = x.D(); if (!D.has(x.d - 7)) return; const r1 = D.h(x.d-1) - D.l(x.d-1); for (let k = 2; k <= 7; k++) if (D.h(x.d-k) - D.l(x.d-k) < r1) return; }
    const mid = (hi + lo)/2, exp = x.j + (p.expiry - orEnd), oco = 'orb' + x.d, tr = p.targetR || undefined;
    x.buy({ type:'stop', price: hi + NQ_TICK, stop: p.stopMode === 'mid' ? mid : lo - NQ_TICK, targetR: tr, exp, oco, flat: 955, reason: 'Průraz ' + p.orMin + 'min opening range nahoru' });
    x.sell({ type:'stop', price: lo - NQ_TICK, stop: p.stopMode === 'mid' ? mid : hi + NQ_TICK, targetR: tr, exp, oco, flat: 955, reason: 'Průraz ' + p.orMin + 'min opening range dolů' });
  },
  info:{ who:'Toby Crabel', src:'Day Trading with Short Term Price Patterns and Opening Range Breakout (1990)', year:1990,
    idea:'Prvních pár minut po otevření ukáže, kdo má převahu. Průraz opening range ve směru, kam trh poprvé vyrazí, často určí směr celého dne. Crabel navíc zjistil, že po nejužším dni z posledních 7 (NR7) přichází expanze.',
    rules:['Opening range: high a low prvních 15 minut od 9:30 NY.','Buy stop nad high, sell stop pod low (OCO: když se vyplní jeden, druhý se ruší).','Stop: střed rozpětí. Cíl 2R, nebo držet do 15:55.','Volitelně jen po NR7 dni. Nevyplněné příkazy platí do 12:00.'],
    basics:['ORB je strategie expanze. Funguje, když den má směr, a prodělává v range dnech.','Obě strany se zadávají předem, žádné rozhodování v emocích.','Crabelova klíčová myšlenka: komprese (NR7) předchází expanzi.'],
    fund:'Nepoužívá přímo. Dny se zprávou v 8:30 ale mívají silnější otevření.', senti:'Kontext v EV filtru (lab se učí, kdy průrazy fungují).',
    works:'Trendové dny, po kompresi, po makro zprávě.', fails:'Range dny s falešnými průrazy oběma směry.',
    howto:['V 9:45 NY (Praha 15:45) si označ high a low prvních 15 minut.','Zadej buy stop 1 tick nad high a sell stop 1 tick pod low jako OCO.','Stop na středu rozpětí, cíl 2R nebo konec dne.','Volitelně: obchoduj jen, když byl včerejší den nejužší za 7 dní.','Do 12:00 nevyplněné příkazy zruš.'] } });

DEF({ id:'vwap_trend', name:'VWAP trend pullback (Shannon)', cat:'intraday', tf:'5m', mkts:'NQ', kind:'trade', risk:0.004, minTrades:6,
  params:{
    abovePct:{ v:0.8, min:0.6, max:0.95, step:0.05, label:'Podíl svíček na straně VWAP od 9:30' },
    touch:{ v:0.3, min:0, max:1.0, step:0.1, label:'Dotyk VWAP do (× ATR)' },
    stopAtr:{ v:1.0, min:0.5, max:2.5, step:0.1, label:'Stop za VWAP (× ATR)' },
    trail:{ v:true, type:'bool', label:'Posouvat stop s VWAP' },
    targetR:{ v:0, min:0, max:4, step:0.5, label:'Cíl (R, 0 = trailing/EOD)' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ st.day = x.d; st.n = 0; st.ab = 0; st.be = 0; st.bars = 0; }
    if (x.t <= 570 || x.t > 960) return;
    const vw = x.vwap(), a = x.atr(14); st.bars++; if (x.c() > vw) st.ab++; else st.be++;
    const L = x.pos();
    if (L && p.trail){ const ts = L.side > 0 ? vw - p.stopAtr*a : vw + p.stopAtr*a; if (L.side > 0 ? ts > L.stop : ts < L.stop) x.setStop(L, ts); }
    if (x.t < 630 || x.t > 900 || L || x.orders().length || st.n >= 2) return;
    const fa = st.ab/st.bars, fb = st.be/st.bars, tr = p.targetR || undefined;
    if (fa >= p.abovePct && x.l() <= vw + p.touch*a && x.c() > vw && x.c() > x.o()){ x.buy({ stop: vw - p.stopAtr*a, targetR: tr, flat: 955, reason: 'Trendový den (' + Math.round(fa*100) + ' % svíček nad VWAP), odraz od VWAP' }); st.n++; }
    else if (fb >= p.abovePct && x.h() >= vw - p.touch*a && x.c() < vw && x.c() < x.o()){ x.sell({ stop: vw + p.stopAtr*a, targetR: tr, flat: 955, reason: 'Trendový den (' + Math.round(fb*100) + ' % svíček pod VWAP), odraz od VWAP' }); st.n++; }
  },
  info:{ who:'Brian Shannon', src:'Maximum Trading Gains With Anchored VWAP (2023); Technical Analysis Using Multiple Timeframes', year:2023,
    idea:'VWAP ukazuje průměrnou cenu, za kterou dnes nakoupili všichni účastníci. V trendovém dni jsou kupující nad VWAP v zisku a při návratu k němu přikupují. VWAP se tak stává dynamickým supportem.',
    rules:['Po 10:30 NY: aspoň 80 % 5m svíček od 9:30 zavřelo nad VWAP, tedy trendový den.','Long: svíčka se dotkne VWAP (do 0,3 ATR) a zavře nad ním býčím tělem.','Stop 1 ATR pod VWAP, posouvá se s VWAP. Výstup trailing stopem nebo v 15:55.','Short zrcadlově, max. 2 obchody denně.'],
    basics:['Nejdřív urči typ dne, pak strategii. VWAP pullback v range dni je fade za nůž.','Shannon: „kdo má kontrolu?“ Nad VWAP kupující, pod ním prodávající.','Anchored VWAP od důležitého bodu (gap, zprávy) funguje stejně, jen s jiným startem.'],
    fund:'Nepoužívá.', senti:'Lab měří výsledky podle denního trendu a sentimentu.',
    works:'Trendové dny po zprávách nebo gapu.', fails:'Dny bez směru, kdy cena kmitá kolem VWAP.',
    howto:['NQ 5m s VWAP (session).','V 10:30 NY spočítej, kolik svíček zavřelo nad VWAP. Nad 80 % je to trendový den nahoru.','Čekej na první dotek VWAP a býčí reakci.','Vstup, stop pod VWAP − 1 ATR a posouvej ho s VWAP.','Drž do zlomení VWAP nebo do konce dne.'] } });

DEF({ id:'mp80', name:'Market Profile – pravidlo 80 % (CBOT/CME)', cat:'intraday', tf:'5m', mkts:'NQ', kind:'trade', risk:0.005, minTrades:4,
  params:{
    periods:{ v:2, min:1, max:3, step:1, label:'30min period uvnitř value area' },
    stopBuf:{ v:0.5, min:0.1, max:1.5, step:0.1, label:'Stop za hranou VA (× ATR)' },
    tgtFrac:{ v:1.0, min:0.5, max:1.0, step:0.1, label:'Cíl: podíl šířky VA' },
    lastEntry:{ v:840, opts:[720,780,840,900], label:'Poslední vstup (NY)' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ st.day = x.d; st.done = false; st.side = 0; st.cnt = 0; }
    const va = x.S.pva; if (!va || st.done) return;
    if (x.t === 575 && x.S.rthOpen !== null){ const op = x.S.rthOpen; st.side = op > va.vah ? 1 : op < va.val ? -1 : 0; }
    if (!st.side || x.t <= 575 || x.t > p.lastEntry || x.t % 30 !== 0 || x.pos() || x.orders().length) return;
    const c = x.c(), inside = c < va.vah && c > va.val; st.cnt = inside ? st.cnt + 1 : 0;
    if (st.cnt < p.periods) return;
    const a = x.atr(14), w = va.vah - va.val;
    if (st.side > 0) x.sell({ stop: Math.max(x.h(), va.vah) + p.stopBuf*a, target: va.vah - p.tgtFrac*w, flat: 955, reason: 'Otevření nad VAH, návrat do value area na ' + p.periods + '× 30 min → přechod k VAL' });
    else x.buy({ stop: Math.min(x.l(), va.val) - p.stopBuf*a, target: va.val + p.tgtFrac*w, flat: 955, reason: 'Otevření pod VAL, návrat do value area na ' + p.periods + '× 30 min → přechod k VAH' });
    st.done = true;
  },
  info:{ who:'J. Peter Steidlmayer (CBOT, 1985); pravidlo 80 % popsal James Dalton', src:'CBOT Market Profile (1985); J. Dalton: Mind Over Markets', year:1985,
    idea:'Market Profile vznikl na Chicago Board of Trade (dnes CME Group). Value area je pásmo, kde proběhlo ~70 % objemu předchozího dne, tedy „férová cena“. Když trh otevře mimo ni a pak se vrátí a vydrží uvnitř, trh nový value nepřijal a často projde celou value area na druhou stranu.',
    rules:['Spočítej value area (70 % objemu) předchozí RTH seance: VAH, VAL, POC.','Otevření v 9:30 nad VAH nebo pod VAL.','Návrat dovnitř a 2 po sobě jdoucí 30min periody (TPO) zavřené uvnitř.','Obchod na druhou stranu VA. Stop za hranou VA + 0,5 ATR. Poslední vstup ve 14:00.'],
    basics:['Cena a hodnota nejsou totéž. Trh hledá cenu, kde je obchodu nejvíc.','Akceptace (čas a objem) vs. odmítnutí (rychlý návrat) je jádro aukční teorie.','Pravidlo platí pro přijetí uvnitř VA, ne pro pouhý dotyk.'],
    fund:'Nepoužívá.', senti:'Kontext v EV filtru.',
    works:'Dny rovnováhy (balance), kdy trh testuje okraj a vrací se.', fails:'Trendové dny, kdy trh nový value přijme a VA se posune.',
    howto:['Na TradingView zapni Volume Profile (Session) nebo TPO pro předchozí RTH seanci, označ VAH, VAL a POC.','V 9:30 zjisti, jestli trh otevřel mimo value area.','Čekej, až se vrátí dovnitř a vydrží 2 půlhodiny (dvě TPO písmena).','Vstup směrem k druhé hraně, stop za hranou, kterou se vrátil.','Cíl: druhá strana value area.'] } });

DEF({ id:'gap_fill', name:'Gap fill (fade otevíracího gapu)', cat:'intraday', tf:'5m', mkts:'NQ', kind:'trade', risk:0.004, minTrades:6,
  params:{
    minGap:{ v:0.15, min:0.05, max:0.4, step:0.05, label:'Min. gap (%)' },
    maxGap:{ v:0.6, min:0.3, max:1.2, step:0.1, label:'Max. gap (%)' },
    stopMult:{ v:1.0, min:0.5, max:2.0, step:0.25, label:'Stop za open (× velikost gapu)' },
    fillFrac:{ v:1.0, min:0.5, max:1.0, step:0.1, label:'Cíl: podíl zaplnění gapu' },
    exitClock:{ v:690, opts:[630,690,750,840], label:'Časový výstup (NY)' },
    skipNews:{ v:true, type:'bool', label:'Vynechat dny se zprávami' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ st.day = x.d; st.done = false; }
    if (st.done || x.t !== 575) return; st.done = true;
    const S = x.S; if (S.rthOpen === null) return;
    const gap = (S.rthOpen - S.prthC)/S.prthC, ag = Math.abs(gap);
    if (ag < p.minGap/100 || ag > p.maxGap/100 || (p.skipNews && x.eventsToday().length)) return;
    const c = x.c(), gp = Math.abs(S.rthOpen - S.prthC), fill = S.rthOpen - p.fillFrac*(S.rthOpen - S.prthC);
    if (gap > 0 && c > fill) x.sell({ stop: Math.max(x.h(), S.rthOpen) + p.stopMult*gp, target: fill, flat: p.exitClock, reason: 'Gap nahoru ' + pct(gap,2) + ' → fade k včerejšímu close (' + nf(S.prthC,2) + ')' });
    else if (gap < 0 && c < fill) x.buy({ stop: Math.min(x.l(), S.rthOpen) - p.stopMult*gp, target: fill, flat: p.exitClock, reason: 'Gap dolů ' + pct(gap,2) + ' → fade k včerejšímu close (' + nf(S.prthC,2) + ')' });
  },
  info:{ who:'Obchodníci otevírací aukce NYSE/Nasdaq; Scott Andrews (Master the Gap)', src:'Statistika gapů na indexech: malé gapy se často zavírají ještě dopoledne', year:null,
    idea:'Gap vznikne, když otevírací aukce v 9:30 začne jinde, než trh včera v 16:00 zavřel. Malé gapy často vytvoří noční obchodníci s nízkou likviditou. Když se do trhu vrátí denní objem, cena se často vrací k včerejšímu close.',
    rules:['Gap = RTH open 9:30 − včerejší RTH close 16:00, v rozmezí 0,15–0,6 %.','V 9:35, pokud gap ještě není zaplněný: fade směrem k včerejšímu close.','Stop: za open + 1× velikost gapu. Cíl: zaplnění gapu.','Časový výstup v 11:30. Dny se zprávami se vynechávají.'],
    basics:['Malé gapy se zavírají častěji než velké. Velký gap je informace, ne šum.','Gap způsobený zprávou (výsledky, CPI) se fadovat nemá.','Velikost gapu je zároveň měřítko rizika.'],
    fund:'Vynechává dny s makro zprávami, protože gap po fundamentu má důvod.', senti:'Kontext v EV filtru.',
    works:'Klidné dny bez zpráv, range režim.', fails:'Gapy po zprávách a trendové dny, kdy gap běží dál (gap and go).',
    howto:['V 9:30 NY zjisti rozdíl open vs. včerejší 16:00 close (RTH, ne Globex).','Když je gap 0,15–0,6 % a není den zpráv, fade po první 5min svíčce.','Cíl včerejší close, stop za open + velikost gapu.','Když do 11:30 nezaplní, zavři.','Statistiku gapů si veď sám: velikost, směr, jestli se zaplnil.'] } });
