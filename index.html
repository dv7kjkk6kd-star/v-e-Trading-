/* ===================== STRATEGIE: swing, trend, kvant, fundamenty, investice (denní data) ===================== */
const TURTLE_MKTS = ['NQ','WORLD','BOND20','GOLD','COMM','EURUSD'];
const stockSyms = x => x.W.stocks.map(s => s.sym);
const curW = (x, syms) => { const E = x.equity(), w = {}; for (const L of x.allLots()) if (!L.shadow) w[L.sym] = (w[L.sym] || 0) + L.side*L.qty*x.dc(L.sym)/E; for (const s of syms || []) w[s] = w[s] || 0; return w; };

DEF({ id:'williams_vb', name:'Larry Williams volatility breakout', cat:'intraday', tf:'1d', mkts:'NQ', kind:'trade', risk:0.01, minTrades:10,
  params:{
    k:{ v:0.6, min:0.3, max:1.2, step:0.05, label:'Průraz: open + k × včerejší rozpětí' },
    sl:{ v:1.0, min:0.5, max:2.0, step:0.1, label:'Stop (× včerejší rozpětí)' },
    maxHold:{ v:3, min:1, max:6, step:1, label:'Max. držení (dny)' },
    trend:{ v:true, type:'bool', label:'Long jen nad SMA' },
    trendLen:{ v:50, min:20, max:200, step:10, label:'Délka SMA' },
    shorts:{ v:false, type:'bool', label:'Shorty pod SMA' } },
  init(){ return {}; },
  onBar(x, p){
    if (!x.dok('NQ', 205) || x.pos('NQ')) return;
    const rg = x.dh('NQ') - x.dl('NQ'); if (!(rg > 0)) return;
    const above = x.dc('NQ') > x.di('NQ','sma',p.trendLen), oco = 'wvb' + x.d;
    if (!p.trend || above) x.buy('NQ', { type:'stopOpen', off: p.k*rg, stopDist: p.sl*rg, exitOpenProfit: true, maxHold: p.maxHold, oco, reason: 'Průraz open + ' + p.k + ' × včerejší rozpětí (' + nf(rg,0) + ' b.)' });
    if (p.shorts && (!p.trend || !above)) x.sell('NQ', { type:'stopOpen', off: p.k*rg, stopDist: p.sl*rg, exitOpenProfit: true, maxHold: p.maxHold, oco, reason: 'Průraz open − ' + p.k + ' × včerejší rozpětí' });
  },
  info:{ who:'Larry Williams (v roce 1987 zhodnotil účet v soutěži Robbins World Cup o 11 376 %)', src:'Long-Term Secrets to Short-Term Trading (1999)', year:1999,
    idea:'Když dnešní cena vyrazí od otevření o víc než zlomek včerejšího rozpětí, do trhu vstoupila síla. Williams vstupuje stop příkazem a vystupuje na prvním ziskovém otevření („bailout“). Drží jen pár dní a žije z krátkých expanzí volatility.',
    rules:['Buy stop = dnešní open + 0,6 × včerejší rozpětí (high − low).','Stop = 1 × včerejší rozpětí pod vstupem.','Výstup: první otevření v zisku, nejpozději po 3 dnech na open.','Filtr: long jen nad SMA50.'],
    basics:['Volatilita má cykly: po kompresi přichází expanze.','Výstup na prvním ziskovém open je Williamsova signatura. Bere statistickou hranu a neriskuje návrat.','Money management: Williams riskuje malé procento a nechá statistiku pracovat.'],
    fund:'Williams používal i COT data a sezónnost. Lab drží základní čistou verzi.', senti:'Kontext v EV filtru.',
    works:'Akciové indexy v rostoucím trendu.', fails:'Klesající trhy, kde průrazy nahoru selhávají.',
    howto:['Každý den spočítej včerejší rozpětí (H − L) a dnešní open.','Zadej buy stop na open + 0,6 × rozpětí, platný jen dnes.','Stop 1× rozpětí pod vstupem.','Druhý den, pokud open je v zisku, zavři na open. Jinak drž max. 3 dny.','Testuj k na svém trhu. Na NQ bývá 0,5–0,7.'] } });

DEF({ id:'rsi2', name:'Connors RSI(2)', cat:'swing', tf:'1d', mkts:'NQ', kind:'trade', minTrades:10,
  params:{
    entryX:{ v:10, min:2, max:25, step:1, label:'Vstup: RSI(2) pod' },
    exitMa:{ v:5, min:3, max:10, step:1, label:'Výstup: close nad SMA' },
    trendLen:{ v:200, min:100, max:250, step:25, label:'Trendový filtr SMA' },
    maxHold:{ v:10, min:3, max:20, step:1, label:'Max. držení (dny)' },
    shorts:{ v:false, type:'bool', label:'Shorty pod SMA200 (RSI > 100−x)' } },
  init(){ return {}; },
  onBar(x, p){
    if (!x.dok('NQ', p.trendLen + 2)) return;
    const c = x.dc('NQ'), s200 = x.di('NQ','sma',p.trendLen), r2 = x.di('NQ','rsi',2), s5 = x.di('NQ','sma',p.exitMa), L = x.pos('NQ');
    if (L){ if ((L.side > 0 && c > s5) || (L.side < 0 && c < s5)) x.exit(L, 'SIG', 'close'); else if (x.d - L.eD >= p.maxHold) x.exit(L, 'TIME', 'close'); return; }
    const rr = 3*x.di('NQ','atr',10);
    if (c > s200 && r2 < p.entryX) x.buy('NQ', { type:'close', alloc: 1, riskRef: rr, reason: 'RSI(2) = ' + nf(r2,1) + ' pod ' + p.entryX + ', nad SMA' + p.trendLen });
    else if (p.shorts && c < s200 && r2 > 100 - p.entryX) x.sell('NQ', { type:'close', alloc: 1, riskRef: rr, reason: 'RSI(2) = ' + nf(r2,1) + ' nad ' + (100 - p.entryX) + ', pod SMA' + p.trendLen });
  },
  info:{ who:'Larry Connors a Cesar Alvarez', src:'Short Term Trading Strategies That Work (2008)', year:2008,
    idea:'Na akciových indexech platí krátkodobý návrat k průměru: po několika dnech prudkého poklesu v dlouhodobém uptrendu index často odskočí. RSI se dvoudenní periodou je extrémně citlivý měřák přeprodanosti.',
    rules:['Filtr: close nad SMA200 (obchoduje se jen ve směru dlouhodobého trendu).','Vstup: RSI(2) pod 10, nákup na close.','Výstup: close nad SMA5.','Connors stop-lossy nepoužívá (v testech zhoršovaly výsledky). Lab má jen časový stop 10 dní.'],
    basics:['Kupuje se strach v uptrendu, ne padající nůž v downtrendu. SMA200 je zásadní.','Vysoká úspěšnost (~70 %) a malé zisky, ztráty bývají vzácné, ale větší.','Strategie stojí na anomálii, která může slábnout. Sleduj výkonnost v čase.'],
    fund:'Nepoužívá.', senti:'Nákup do strachu je kontrariánský sentiment ve své podstatě. Lab měří, jestli funguje líp při F&G pod 25.',
    works:'Býčí trhy s korekcemi.', fails:'Začátek medvědího trhu: první propady pod SMA200 bývají nejbolestivější.',
    howto:['Denní graf indexu (NQ, SPY, QQQ), SMA200, SMA5 a RSI délky 2.','Těsně před close zkontroluj: cena nad SMA200 a RSI(2) pod 10 → nákup.','Drž, dokud close nevyskočí nad SMA5.','Pozici dimenzuj tak, aby i propad 3× ATR byl únosný.','Zapisuj si úspěšnost. Pod 60 % v posledních 30 obchodech je varování, že se režim mění.'] } });

DEF({ id:'ibs', name:'IBS mean reversion', cat:'swing', tf:'1d', mkts:'NQ', kind:'trade', minTrades:10,
  params:{
    lo:{ v:0.2, min:0.05, max:0.35, step:0.05, label:'Vstup: IBS pod' },
    hi:{ v:0.8, min:0.5, max:0.95, step:0.05, label:'Výstup: IBS nad' },
    trendOn:{ v:false, type:'bool', label:'Jen nad SMA' },
    trendLen:{ v:200, min:50, max:250, step:25, label:'Délka SMA' },
    maxHold:{ v:5, min:2, max:10, step:1, label:'Max. držení (dny)' } },
  init(){ return {}; },
  onBar(x, p){
    if (!x.dok('NQ', 205)) return;
    const c = x.dc('NQ'), h = x.dh('NQ'), l = x.dl('NQ'), ibs = h > l ? (c - l)/(h - l) : 0.5, L = x.pos('NQ');
    if (L){ if (ibs > p.hi || c > x.dh('NQ', 1)) x.exit(L, 'SIG', 'close'); else if (x.d - L.eD >= p.maxHold) x.exit(L, 'TIME', 'close'); return; }
    if (ibs < p.lo && (!p.trendOn || c > x.di('NQ','sma',p.trendLen))) x.buy('NQ', { type:'close', alloc: 1, riskRef: 3*x.di('NQ','atr',10), reason: 'IBS = ' + nf(ibs,2) + ' (close u minima dne)' });
  },
  info:{ who:'Akademický výzkum (Pagonidis 2013; Alpha Architect), u tebe FM Swing IBS bot', src:'„The IBS Effect: Mean Reversion in Equity ETFs“ (A. Pagonidis, 2013)', year:2013,
    idea:'Internal Bar Strength = (close − low) / (high − low). Když index zavře u minima dne (IBS < 0,2), další den má statisticky kladný výnos. Když zavře u maxima (IBS > 0,8), výhoda mizí. Jednoduchá, ale robustní anomálie na indexech.',
    rules:['IBS < 0,2 → nákup na close.','Výstup: IBS > 0,8, nebo close nad včerejším high.','Max. 5 dní. Volitelný trendový filtr SMA200.'],
    basics:['Měříš, kde trh zavřel v rámci dne. Je to stopa nuceného prodeje na konci seance.','Funguje na indexech a ETF, na jednotlivých akciích výrazně hůř.','Kombinace s RSI(2) zvyšuje přesnost, ale snižuje počet obchodů.'],
    fund:'Nepoužívá.', senti:'Kontrariánský. Lab měří efekt podle sentimentu.',
    works:'Indexy v range i uptrendu.', fails:'Silné medvědí trendy, kdy close u minima předchází dalšímu propadu.',
    howto:['Spočítej IBS 5 minut před close (TradingView: (close-low)/(high-low)).','Pod 0,2 kup na close.','Prodej, až IBS přesáhne 0,8 nebo cena překoná včerejší high.','Max. 5 dní držení.','Porovnej s tvým Swing IBS botem v projektu: lab ti ukáže, ve kterém režimu IBS selhává.'] } });

DEF({ id:'wyckoff', name:'Wyckoff spring', cat:'swing', tf:'1d', mkts:'NQ, WORLD, GOLD, COMM', kind:'trade', risk:0.01, minTrades:8,
  params:{
    N:{ v:40, min:20, max:80, step:5, label:'Délka obchodního rozpětí (dny)' },
    maxWidth:{ v:0.12, min:0.05, max:0.25, step:0.01, label:'Max. šířka rozpětí' },
    volMult:{ v:1.2, min:0.8, max:2.0, step:0.1, label:'Objem springu ≥ průměr ×' },
    depth:{ v:1.0, min:0.3, max:2.0, step:0.1, label:'Max. hloubka pod supportem (× ATR)' },
    tgt:{ v:'range', opts:['range','R2'], label:'Cíl: horní hrana / 2R' },
    shorts:{ v:false, type:'bool', label:'Upthrust shorty' } },
  init(){ return {}; },
  onBar(x, p){
    for (const sym of ['NQ','WORLD','GOLD','COMM']){
      if (!x.W.daily[sym] || !x.dok(sym, p.N + 25) || x.pos(sym)) continue;
      const hh = x.di(sym,'hh',p.N,1), ll = x.di(sym,'ll',p.N,1); if ((hh - ll)/ll > p.maxWidth) continue;
      const a = x.di(sym,'atr',14), l = x.dl(sym), h = x.dh(sym), c = x.dc(sym), v = x.dv(sym), va = x.di(sym,'vsma',20,1);
      if (l < ll && ll - l <= p.depth*a && c > ll && v > p.volMult*va)
        x.buy(sym, { stop: l - 0.25*a, target: p.tgt === 'range' ? hh : undefined, targetR: p.tgt === 'R2' ? 2 : undefined, maxHold: 30, reason: 'Spring: low pod supportem rozpětí ' + p.N + ' dní a návrat nad něj se zvýšeným objemem' });
      else if (p.shorts && h > hh && h - hh <= p.depth*a && c < hh && v > p.volMult*va)
        x.sell(sym, { stop: h + 0.25*a, target: p.tgt === 'range' ? ll : undefined, targetR: p.tgt === 'R2' ? 2 : undefined, maxHold: 30, reason: 'Upthrust: high nad rezistencí a návrat pod ni' });
    }
  },
  info:{ who:'Richard D. Wyckoff (1873–1934)', src:'Wyckoffova metoda; The Richard D. Wyckoff Method of Trading and Investing in Stocks (1931)', year:1931,
    idea:'„Složený operátor“ (velký hráč) akumuluje v obchodním rozpětí. Před markupem často shodí cenu pod support (spring), vybere stopky a nakoupí levně od vystrašených. Rychlý návrat nad support s objemem ukazuje, že nabídka je vyčerpaná.',
    rules:['Rozpětí: posledních 40 dní, šířka do 12 %.','Spring: dnešní low pod supportem (max. 1 ATR), close zpět nad ním, objem > 1,2 × průměr.','Nákup na další open. Stop pod low springu. Cíl horní hrana rozpětí. Max. 30 dní.'],
    basics:['Tři zákony: nabídka a poptávka, příčina a následek (šířka akumulace určuje velikost pohybu), úsilí a výsledek (objem vs. pohyb ceny).','Spring bez návratu není spring, je to průraz.','Kontext fáze (akumulace vs. distribuce) je víc než samotná svíčka.'],
    fund:'Wyckoff sledoval, kdo stojí za pohybem. Fundamenty přímo nepoužívá.', senti:'Spring je kontrariánský okamžik strachu.',
    works:'Akumulace po delším poklesu.', fails:'Distribuce, kdy průraz supportu je začátek markdownu.',
    howto:['Najdi trh, který 2 měsíce chodí do strany (rozpětí do ~12 %).','Označ support a rezistenci.','Čekej na den, kdy cena prorazí support, ale zavře zpět v rozpětí s vyšším objemem.','Kup další den, stop pod low springu, cíl horní hrana.','Ideálně čekej na „test“: další návrat k low s nižším objemem.'] } });

DEF({ id:'minervini', name:'Minervini trend template + VCP', cat:'swing', tf:'1d', mkts:'Akcie (24)', kind:'trade', risk:0.01, minTrades:8,
  params:{
    rsTop:{ v:0.3, min:0.1, max:0.5, step:0.05, label:'RS: horních x % trhu' },
    contr:{ v:0.08, min:0.03, max:0.15, step:0.01, label:'VCP: max. rozpětí 10 dní' },
    volMult:{ v:1.4, min:1.0, max:2.5, step:0.1, label:'Objem průrazu ≥ průměr50 ×' },
    stopPct:{ v:0.07, min:0.04, max:0.12, step:0.01, label:'Stop (%)' },
    target:{ v:0.25, min:0, max:0.5, step:0.05, label:'Cíl (%, 0 = jen trailing SMA50)' },
    mkt:{ v:true, type:'bool', label:'Nové nákupy jen když je index nad SMA50' },
    maxPos:{ v:6, min:6, max:6, step:1, opt:false, label:'Max. pozic' } },
  init(){ return {}; },
  onBar(x, p){
    if (!x.dok('NQ', 260)) return;
    for (const L of x.allLots().slice()){ const c = x.dc(L.sym), s50 = x.di(L.sym,'sma',50);
      if (c < s50){ x.exit(L, 'SIG', 'close'); continue; }
      if (L.risk0 && c - L.entry >= 2*L.risk0 && L.stop < L.entry) x.setStop(L, L.entry); }
    if (p.mkt && x.dc('NQ') < x.di('NQ','sma',50)) return;
    let open = x.allLots().length; if (open >= p.maxPos) return;
    const rs = stockSyms(x).map(s => ({ s, r: x.di(s,'roc',126) })).filter(o => !isNaN(o.r)).sort((a,b) => b.r - a.r);
    for (const { s } of rs.slice(0, Math.ceil(rs.length*p.rsTop))){
      if (x.pos(s) || !x.dok(s, 260)) continue;
      const c = x.dc(s), s50 = x.di(s,'sma',50), s150 = x.di(s,'sma',150), s200 = x.di(s,'sma',200), s200b = x.di(s,'sma',200,20), hi = x.di(s,'hh',252), lo = x.di(s,'ll',252);
      if (!(c > s150 && s150 > s200 && s200 > s200b && s50 > s150 && c > s50 && c >= 1.3*lo && c >= 0.75*hi)) continue;
      const h10 = x.di(s,'hh',10,1), l10 = x.di(s,'ll',10,1), r10 = (h10 - l10)/c, r20 = (x.di(s,'hh',10,11) - x.di(s,'ll',10,11))/c;
      if (!(r10 < p.contr && r10 < 0.75*r20 && c > h10 && x.dv(s) > p.volMult*x.di(s,'vsma',50,1))) continue;
      x.buy(s, { type:'close', stopPct: p.stopPct, target: p.target > 0 ? c*(1 + p.target) : undefined, maxAlloc: 0.25, reason: 'Trend template OK, VCP (' + pct(r20,0) + ' → ' + pct(r10,0) + '), průraz pivotu s objemem' });
      if (++open >= p.maxPos) break;
    }
  },
  info:{ who:'Mark Minervini (vítěz US Investing Championship 1997 a 2021)', src:'Trade Like a Stock Market Wizard (2013); Think & Trade Like a Champion (2017)', year:2013,
    idea:'Velké pohyby přicházejí z 2. fáze (Stage 2) dlouhodobého uptrendu. Minervini kupuje jen akcie, které splní „trend template“, a vstupuje na průrazu po kontrakci volatility (VCP), kdy prodejci vyschli a nabídka se zúžila.',
    rules:['Trend template: cena > SMA150 > SMA200, SMA200 roste aspoň měsíc, SMA50 > SMA150, cena > SMA50, ≥ 30 % nad 52t minimem, do 25 % od 52t maxima, RS v horních 30 %.','VCP: rozpětí posledních 10 dní < 8 % a užší než předchozích 10.','Průraz: close nad 10denním high s objemem ≥ 1,4 × průměr.','Stop 7 %, po +2R na BE. Výstup pod SMA50 nebo +25 %. Max. 6 pozic.'],
    basics:['Ztráty se řežou rychle. Minervini: „průměrná ztráta musí být menší než průměrný zisk“.','Nekupuj levné akcie, kupuj silné. RS je zásadní.','Trh (M) rozhoduje: 3 ze 4 akcií jdou s trhem.'],
    fund:'Minervini preferuje akcie s akcelerací zisků. Lab používá technickou část (fundamentální stranu má CAN SLIM).', senti:'Lab měří výkonnost podle sentimentu trhu.',
    works:'Silné býčí trhy s lídry.', fails:'Choppy trhy, kde průrazy selhávají a stopy se sčítají.',
    howto:['Projdi screener: cena nad SMA50/150/200 ve správném pořadí, blízko 52t maxima, RS > 70.','Najdi base s postupně menšími poklesy (např. 25 % → 12 % → 6 %).','Kup průraz pivotu s objemem.','Stop max. 7–8 % pod vstupem, nikdy neprůměruj ztrátu.','Při +2R posuň stop na BE, prodávej do síly nebo při zlomení SMA50.'] } });

DEF({ id:'canslim', name:'CAN SLIM (O’Neil)', cat:'swing', tf:'1d', mkts:'Akcie (24)', kind:'trade', minTrades:8,
  params:{
    cMin:{ v:0.2, min:0.1, max:0.5, step:0.05, label:'C: kvartální EPS r/r ≥' },
    aMin:{ v:0.2, min:0.1, max:0.5, step:0.05, label:'A: roční EPS růst ≥' },
    rsTop:{ v:0.25, min:0.1, max:0.5, step:0.05, label:'L: RS v horních x %' },
    stopPct:{ v:0.07, min:0.05, max:0.1, step:0.01, label:'Stop (%)' },
    tp:{ v:0.22, min:0.15, max:0.4, step:0.01, label:'Výběr zisku (%)' },
    volMult:{ v:1.4, min:1.0, max:2.0, step:0.1, label:'S: objem ≥ průměr50 ×' },
    mExit:{ v:true, type:'bool', label:'M: prodat vše pod SMA200 indexu' },
    maxPos:{ v:6, min:6, max:6, step:1, opt:false, label:'Max. pozic' } },
  init(){ return {}; },
  onBar(x, p){
    if (!x.dok('NQ', 260)) return;
    const ic = x.dc('NQ'), s50 = x.di('NQ','sma',50), s200 = x.di('NQ','sma',200);
    if (p.mExit && ic < s200){ x.exitAll('SIG', 'close'); return; }
    if (!(ic > s50 && s50 > s200)) return;
    let open = x.allLots().length; if (open >= p.maxPos) return;
    const rs = stockSyms(x).map(s => ({ s, r: x.di(s,'roc',252) })).filter(o => !isNaN(o.r)).sort((a,b) => b.r - a.r);
    for (const { s } of rs.slice(0, Math.ceil(rs.length*p.rsTop))){
      if (x.pos(s)) continue; const F = x.fund(s), c = x.dc(s);
      if (!F || F.yoyQ < p.cMin || F.yoyA < p.aMin) continue;
      if (!(c >= 0.95*x.di(s,'hh',252,1) && c > x.di(s,'hh',20,1) && x.dv(s) >= p.volMult*x.di(s,'vsma',50,1))) continue;
      x.buy(s, { type:'close', alloc: 1/p.maxPos, stopPct: p.stopPct, target: c*(1 + p.tp), reason: 'C ' + pct(F.yoyQ,0) + ', A ' + pct(F.yoyA,0) + ', N: nové maximum, S: objem, L: RS lídr, M: trh v uptrendu' });
      if (++open >= p.maxPos) break;
    }
  },
  info:{ who:'William J. O’Neil (zakladatel Investor’s Business Daily)', src:'How to Make Money in Stocks (1988, 4. vyd. 2009)', year:1988,
    idea:'O’Neil studoval největší vítěze akciového trhu od roku 1880 a našel společné rysy, které shrnul do akronymu CAN SLIM. Kombinuje fundamenty (zisky) s technikou (nová maxima, objem) a směrem trhu.',
    rules:['C: aktuální kvartální EPS r/r ≥ 20–25 %.','A: roční růst EPS ≥ 20–25 %.','N: nové maximum (do 5 % od 52t high a průraz 20denního pivotu).','S: objem průrazu ≥ 1,4 × průměr.','L: lídr, RS v horních 25 %.','I: institucionální zájem (v labu ho zastupuje objem).','M: index nad SMA50 > SMA200. Pod SMA200 se prodává vše.','Stop −7 %, výběr zisku +20–25 %, 6 pozic po 1/6 kapitálu.'],
    basics:['Pravidlo 7–8 %: O’Neilův jediný nepodkročitelný příkaz. Ztráta se nikdy nedrží.','Fundamenty vybírají, technika časuje.','Směr trhu (M) je důležitější než výběr akcie.'],
    fund:'Jádro: C a A jsou čisté fundamenty (růst zisků z kvartálních výsledků simulovaných firem).', senti:'M je sentiment trhu přes cenu. Lab ho měří i přes F&G.',
    works:'Nové býčí trhy po korekci, kdy lídři dělají nová maxima.', fails:'Konec býčích trhů, kdy lídři padají první.',
    howto:['Screener: EPS r/r ≥ 25 % za poslední kvartál i rok, RS ≥ 80, blízko 52t maxima.','Čekej na base (cup with handle, flat base) a průraz pivotu s objemem.','Kupuj jen, když IBD/trh je v „confirmed uptrend“.','Stop 7–8 %, zisky vybírej při +20–25 %.','Při distribuci trhu (několik dní s poklesem na vyšším objemu) zvedni hotovost.'] } });

DEF({ id:'turtle', name:'Turtle Trading (Dennis & Eckhardt)', cat:'trend', tf:'1d', mkts:'NQ, WORLD, BOND20, GOLD, COMM, EURUSD', kind:'trade', minTrades:10,
  params:{
    entryLen:{ v:20, min:10, max:55, step:5, label:'Průraz N-denního high/low' },
    exitLen:{ v:10, min:5, max:30, step:5, label:'Výstup na M-denním low/high' },
    stopN:{ v:2, min:1, max:3, step:0.5, label:'Stop (× N = ATR20)' },
    addN:{ v:0.5, min:0.5, max:1.5, step:0.25, label:'Pyramidování každých x N' },
    maxUnits:{ v:4, min:1, max:4, step:1, label:'Max. jednotek na trh' },
    skip:{ v:true, type:'bool', label:'Přeskočit signál po vítězném obchodu (S1)' },
    shorts:{ v:true, type:'bool', label:'I shorty' } },
  init(){ return { had: {}, win: {}, camp: {} }; },
  onBar(x, p, st){
    for (const sym of TURTLE_MKTS){
      if (!x.W.daily[sym] || !x.dok(sym, 60)) continue;
      const N = x.di(sym,'atr',20), lots = x.lots(sym), unitRisk = 0.004*p.stopN;
      if (st.had[sym] && !lots.length){ const T = x.R.acc.trades; let s = 0; for (let k = T.length - 1; k >= 0 && T[k].xD >= (st.camp[sym] || 0); k--) if (T[k].sym === sym) s += T[k].pnl; st.win[sym] = s > 0; }
      st.had[sym] = lots.length > 0;
      if (lots.length){
        const side = lots[0].side, ex = side > 0 ? x.di(sym,'ll',p.exitLen) : x.di(sym,'hh',p.exitLen), last = lots[lots.length-1], base = last.entry - side*p.stopN*(last.meta ? last.meta.N : N);
        for (const L of lots) x.setStop(L, side > 0 ? Math.max(base, ex) : Math.min(base, ex));
        if (lots.length < p.maxUnits && x.allLots().length < 10){ const o = { type:'stop', price: last.entry + side*p.addN*(last.meta ? last.meta.N : N), stopDist: p.stopN*N, riskPct: unitRisk, maxAlloc: 0.6, meta: { N }, reason: 'Pyramidování: jednotka ' + (lots.length + 1) + ' (+' + p.addN + 'N)' }; side > 0 ? x.buy(sym, o) : x.sell(sym, o); }
        continue;
      }
      let len = p.entryLen; if (p.skip && st.win[sym]) len = Math.max(55, p.entryLen);
      const hi = x.di(sym,'hh',len), lo = x.di(sym,'ll',len), oco = 'tt' + sym + x.d; st.camp[sym] = x.d + 1;
      if (x.allLots().length >= 10) continue;
      x.buy(sym, { type:'stop', price: hi, stopDist: p.stopN*N, riskPct: unitRisk, maxAlloc: 0.6, meta: { N }, oco, reason: 'Průraz ' + len + 'denního maxima, N = ' + nf(N, 2) });
      if (p.shorts) x.sell(sym, { type:'stop', price: lo, stopDist: p.stopN*N, riskPct: unitRisk, maxAlloc: 0.6, meta: { N }, oco, reason: 'Průraz ' + len + 'denního minima, N = ' + nf(N, 2) });
    }
  },
  info:{ who:'Richard Dennis a William Eckhardt; pravidla zveřejnil Curtis Faith', src:'Way of the Turtle (C. Faith, 2007); původní experiment z roku 1983', year:1983,
    idea:'Dennis se vsadil s Eckhardtem, že obchodníka lze vychovat. Najal 23 lidí z inzerátu, za dva týdny je naučil mechanický systém průrazů a dal jim peníze. Za čtyři roky údajně vydělali přes 100 milionů dolarů. Systém je čistý trend following: kup nová maxima, řež ztráty, nech zisky běžet.',
    rules:['N = 20denní ATR (volatilita). Původně jednotka = 1 % kapitálu / N. Lab používá poloviční jednotku (riziko 1 % na jednotku při stopu 2N) a max. 12 jednotek celkem.','Systém 1: vstup na průrazu 20denního high/low, výstup na 10denním opačném extrému.','Přeskoč signál S1, pokud byl předchozí obchod vítězný (pak jen 55denní průraz).','Stop 2N. Pyramidování po ½N až na 4 jednotky, stopy se posouvají 2N pod poslední jednotku.','Diverzifikace: akcie, dluhopisy, zlato, komodity, měny.'],
    basics:['Většina obchodů prodělá (~35–40 % úspěšnost). Zisk dělá pár obrovských trendů.','Velikost podle volatility (N) dělá z různých trhů srovnatelné sázky.','Disciplína: Turtles, kteří přeskakovali signály, minuli právě ty velké trendy.'],
    fund:'Záměrně žádné. Dennis tvrdil, že cena obsahuje všechno.', senti:'Lab měří výkonnost podle režimu, ale pravidla neupravuje. Želvy braly každý signál.',
    works:'Dlouhé trendy (komodity 2007, dluhopisy 2022, krize).', fails:'Roky bez trendu: série malých ztrát a dlouhé drawdowny.',
    howto:['Vyber 6–20 nekorelovaných trhů (futures nebo ETF).','Každý den spočítej N (ATR20) a 20denní high/low.','Zadej stop příkazy na průraz, velikost = 1 % kapitálu / N.','Stop 2N, výstup na 10denním low (u long).','Přidávej po ½N až do 4 jednotek. Respektuj limity korelovaných trhů.','Připrav se psychicky na drawdown 20–30 %. Je to cena za velké trendy.'] } });

DEF({ id:'cta', name:'CTA time-series momentum', cat:'trend', tf:'1d', mkts:'NQ, WORLD, BOND20, GOLD, COMM, EURUSD', kind:'port', minTrade: 0.01,
  params:{
    sig:{ v:'ret', opts:['ret','ema'], label:'Signál: 12m výnos / EMA crossover' },
    look:{ v:252, min:63, max:252, step:21, label:'Lookback výnosu (dny)' },
    fast:{ v:50, min:20, max:100, step:10, label:'Rychlá EMA' },
    slow:{ v:200, min:100, max:300, step:25, label:'Pomalá EMA' },
    tv:{ v:0.15, min:0.06, max:0.25, step:0.01, label:'Cílová volatilita portfolia' },
    rebal:{ v:21, min:5, max:42, step:1, label:'Rebalance každých (dní)' } },
  init(){ return { last: -9999 }; },
  onBar(x, p, st){
    if (x.d - st.last < p.rebal) return;
    const w = {}; let g = 0;
    for (const sym of TURTLE_MKTS){ if (!x.W.daily[sym] || !x.dok(sym, Math.max(p.look, p.slow) + 2)) continue;
      const s = p.sig === 'ret' ? Math.sign(x.di(sym,'roc',p.look)) : Math.sign(x.di(sym,'ema',p.fast) - x.di(sym,'ema',p.slow));
      const vol = x.di(sym,'vol',60)*Math.sqrt(252); if (!(vol > 0) || !s) continue;
      w[sym] = clamp(s*(p.tv/Math.sqrt(TURTLE_MKTS.length))/vol, -1.5, 1.5); g += Math.abs(w[sym]); }
    if (!Object.keys(w).length) return; st.last = x.d;
    if (g > 3) for (const k in w) w[k] *= 3/g;
    x.rebalance(w, 'TSMOM: ' + Object.keys(w).map(k => k + (w[k] > 0 ? '↑' : '↓')).join(' '));
  },
  info:{ who:'Ed Seykota, AQR (Moskowitz, Ooi, Pedersen), Man AHL, Winton', src:'Time Series Momentum (Journal of Financial Economics, 2012)', year:2012,
    idea:'Aktivum, které za poslední rok rostlo, má tendenci růst dál a naopak. Platí to napříč 58 trhy a stoletím dat. Moderní CTA fondy drží long nebo short podle trendu a velikost řídí cílovou volatilitou, takže klidné i divoké trhy přispívají stejně.',
    rules:['Signál: znaménko 12měsíčního výnosu (nebo EMA50 vs. EMA200).','Váha = signál × (cílová vol / √počet trhů) / realizovaná vol 60 dní.','Limit ±150 % na trh, hrubá expozice max. 300 %.','Rebalance měsíčně.'],
    basics:['Volatility targeting je půlka výkonu: stejné riziko na každý trh.','Trend following je „long volatilita“. Vydělává v krizích, kdy ostatní prodělávají.','Seykota: „Trend je tvůj přítel, dokud neskončí.“ Exity jsou mechanické.'],
    fund:'Nepoužívá.', senti:'Nepoužívá. Cena je jediný vstup.',
    works:'Dlouhé makro trendy a krize (2008, 2022).', fails:'Prudké obraty (V-shape) a roky bez trendu.',
    howto:['Seznam 6–50 likvidních futures nebo ETF.','Jednou měsíčně spočítej 12měsíční výnos a 60denní volatilitu každého trhu.','Long, když je výnos kladný, short, když záporný. Velikost ~10–15 % vol / √n / vol trhu.','Rebalancuj měsíčně, nic víc.','Očekávej Sharpe 0,5–0,8 a dlouhé období podprůměru.'] } });

DEF({ id:'faber', name:'Faber GTAA (10měsíční SMA)', cat:'trend', tf:'1d', mkts:'NQ, WORLD, BOND7, GOLD, COMM', kind:'port',
  params:{ len:{ v:210, min:120, max:260, step:10, label:'SMA (dny, 210 ≈ 10 měsíců)' }, wmode:{ v:'equal', opts:['equal','invvol'], label:'Váhy: rovné / inverzní volatilita' } },
  init(){ return {}; },
  onBar(x, p){
    if (!x.W.cal.isMonthEnd(x.d)) return;
    const syms = ['NQ','WORLD','BOND7','GOLD','COMM'], w = {}, on = []; let iv = 0;
    for (const s of syms){ if (!x.dok(s, p.len + 61)) return; if (x.dc(s) > x.di(s,'sma',p.len)){ on.push(s); w[s] = p.wmode === 'equal' ? 1 : 1/x.di(s,'vol',60); iv += w[s]; } }
    for (const s of on) w[s] = p.wmode === 'equal' ? 0.2 : 0.2*on.length*w[s]/iv;
    x.rebalance(w, 'Konec měsíce: nad SMA' + p.len + ' → ' + (on.join(', ') || 'vše hotovost'));
  },
  info:{ who:'Mebane Faber (Cambria)', src:'A Quantitative Approach to Tactical Asset Allocation (Journal of Wealth Management, 2007)', year:2007,
    idea:'Jednoduché pravidlo: drž aktivum, jen když je jeho cena nad 10měsíčním průměrem. Jinak drž hotovost (T-bills). Na 5 třídách aktiv to v historii drželo výnos akcií s polovičním drawdownem.',
    rules:['5 tříd: US akcie, svět, dluhopisy, zlato, komodity (Faber měl i REIT).','Poslední den měsíce: nad 10měsíční SMA → váha 20 %, pod → hotovost.','Hotovost úročí krátkodobá sazba (v labu sim. Fed rate).'],
    basics:['Cílem není porazit trh v býčím roce. Cílem je přežít krach (2008: −50 % vs. ~−10 %).','Měsíční frekvence = málo obchodů, nízké náklady, žádný šum.','Funguje proto, že trend following je ochrana proti dlouhým medvědím trhům.'],
    fund:'Úrok z hotovosti je makro vstup (sazba Fedu).', senti:'Nepoužívá.',
    works:'Dlouhé medvědí trhy.', fails:'Rychlé propady a návraty (whipsaw kolem SMA).',
    howto:['Vyber 5 ETF (např. VTI, VEU, IEF, GLD, DBC).','Poslední obchodní den v měsíci porovnej cenu s 10měsíční SMA.','Nad SMA drž 20 %, pod SMA přesuň do krátkodobých dluhopisů nebo hotovosti.','Nic jiného nedělej. Kontrola trvá 5 minut měsíčně.'] } });

DEF({ id:'dual_mom', name:'Dual Momentum (Antonacci GEM)', cat:'trend', tf:'1d', mkts:'NQ, WORLD, BOND7', kind:'port',
  params:{ look:{ v:252, min:126, max:252, step:21, label:'Lookback (dny)' } },
  init(){ return { held: null }; },
  onBar(x, p, st){
    if (!x.W.cal.isMonthEnd(x.d) || !x.dok('NQ', p.look + 2)) return;
    const rU = x.di('NQ','roc',p.look), rW = x.di('WORLD','roc',p.look); let rc = 0; for (let k = 0; k < p.look; k += 21){ const M = x.macro(k); if (M) rc += M.rate/100*21/252; }
    const best = rU > rW ? 'NQ' : 'WORLD', pick = Math.max(rU, rW) > rc ? best : 'BOND7';
    if (pick === st.held) return; st.held = pick;
    x.rebalance({ [pick]: 1 }, 'Relativní: ' + best + ' (' + spct(Math.max(rU, rW), 0) + '), absolutní vs. T-bills ' + spct(rc, 1) + ' → ' + pick);
  },
  info:{ who:'Gary Antonacci', src:'Dual Momentum Investing (McGraw-Hill, 2014)', year:2014,
    idea:'Kombinuje dva typy momenta. Relativní: drž silnější z US a světových akcií. Absolutní: pokud ani vítěz neporáží T-bills, utíkej do dluhopisů. Jeden trh, jedno rozhodnutí měsíčně.',
    rules:['Konec měsíce: 12měsíční výnos US vs. světové akcie, silnější vyhrává.','Když je výnos vítěze nad výnosem T-bills, drž ho na 100 %.','Jinak 100 % agregátní dluhopisy.'],
    basics:['Relativní momentum vybírá, absolutní chrání před krachem.','Málo obchodů (~1,5 ročně) znamená nízké náklady i daně.','Falešné signály u bodu zlomu jsou cenou za ochranu.'],
    fund:'Výnos T-bills (sazba Fedu) je makro práh absolutního momenta.', senti:'Nepoužívá.',
    works:'Dlouhé trendy a medvědí trhy.', fails:'Rychlé V-obraty (2020: ven pozdě, zpět pozdě).',
    howto:['Měsíčně porovnej 12m výnos SPY (US) a VEU (svět) a výnos BIL (T-bills).','Vítěz relativního momenta, pokud porazil BIL. Jinak AGG nebo BND.','Přepni jen při změně. Jinak nic.'] } });

DEF({ id:'tom', name:'Přelom měsíce (sezónnost)', cat:'quant', tf:'1d', mkts:'NQ', kind:'trade', minTrades:10,
  params:{ pre:{ v:1, min:0, max:3, step:1, label:'Nákup x dní před koncem měsíce' }, post:{ v:3, min:1, max:5, step:1, label:'Prodej x. obchodní den nového měsíce' }, trend:{ v:false, type:'bool', label:'Jen nad SMA200' } },
  init(){ return {}; },
  onBar(x, p){
    const cal = x.W.cal, L = x.pos('NQ');
    if (L){ if (cal.get(x.d).m !== cal.get(L.eD).m && cal.tdom(x.d) >= p.post) x.exit(L, 'TIME', 'close'); return; }
    if (!x.dok('NQ', 205) || cal.dtme(x.d) !== p.pre) return;
    if (p.trend && x.dc('NQ') < x.di('NQ','sma',200)) return;
    x.buy('NQ', { type:'close', alloc: 1, riskRef: 3*x.di('NQ','atr',10), reason: 'Přelom měsíce: nákup ' + p.pre + ' obch. dny před koncem, prodej ' + p.post + '. den' });
  },
  info:{ who:'Ariel (1987), Lakonishok & Smidt (1988), McConnell & Xu (2008)', src:'„A Monthly Effect in Stock Returns“ (R. Ariel, Journal of Financial Economics, 1987)', year:1987,
    idea:'Velká část výnosu akcií historicky připadla na pár dní kolem přelomu měsíce. Důvodem jsou přítoky peněz (mzdy, penzijní fondy, rebalance), které se investují na začátku měsíce.',
    rules:['Nákup na close 1 obchodní den před posledním dnem měsíce.','Prodej na close 3. obchodního dne nového měsíce.','Zbytek měsíce hotovost.'],
    basics:['Je to kalendářní anomálie. Bez fundamentálního důvodu by šlo o datamining.','Vysoká frekvence, malé zisky na obchod: náklady rozhodují.','Anomálie po zveřejnění slábnou. Sleduj výkon v čase.'],
    fund:'Důvodem jsou toky peněz (makro), ne zisky firem.', senti:'Nepoužívá.',
    works:'Stabilní trhy s pravidelnými přítoky.', fails:'Krize, kdy toky otáčí redemptions.',
    howto:['V kalendáři si označ poslední 2 obchodní dny v měsíci.','Kup index na close předposledního dne.','Prodej na close 3. dne nového měsíce.','Porovnej se svým swing botem: kalendář může sloužit jako filtr.'] } });

DEF({ id:'stat_arb', name:'Stat-arb krátkodobý reverzal (Simons styl)', cat:'quant', tf:'1d', mkts:'Akcie (24), tržně neutrální', kind:'port', minTrade: 0.002,
  params:{
    look:{ v:1, min:1, max:5, step:1, label:'Reziduální výnos za (dny)' },
    k:{ v:4, min:2, max:8, step:1, label:'Počet long/short akcií' },
    hold:{ v:1, min:1, max:5, step:1, label:'Rebalance každých (dní)' },
    gross:{ v:1.0, min:0.5, max:2.0, step:0.25, label:'Hrubá expozice' } },
  init(){ return { last: -9999 }; },
  onBar(x, p, st){
    if (x.d - st.last < p.hold || !x.dok('NQ', 30)) return; st.last = x.d;
    const rm = x.di('NQ','roc',p.look), arr = stockSyms(x).map(s => ({ s, r: x.di(s,'roc',p.look) - x.W.stockMap[s].beta*rm })).filter(o => !isNaN(o.r)).sort((a,b) => a.r - b.r);
    const w = {}, k = Math.min(p.k, Math.floor(arr.length/2)); arr.slice(0, k).forEach(o => w[o.s] = p.gross/2/k); arr.slice(-k).forEach(o => w[o.s] = -p.gross/2/k);
    for (const s of stockSyms(x)) if (!(s in w)) w[s] = 0;
    x.rebalance(w, 'Long ' + k + ' největších poražených, short ' + k + ' vítězů (reziduálně)');
  },
  info:{ who:'Jim Simons / Renaissance Technologies (Medallion); akademicky Lehmann (1990), Lo & MacKinlay (1990)', src:'Lo & MacKinlay: „When Are Contrarian Profits Due to Stock Market Overreaction?“ (1990); Khandani & Lo (2007)', year:1990,
    idea:'Matematik Jim Simons postavil Medallion fond, který podle veřejných zpráv vydělával kolem 66 % ročně před poplatky. Jeho modely jsou tajné. Veřejně zdokumentovaný základ statistické arbitráže je krátkodobý reverzal: akcie, které dnes nadměrně spadly vůči trhu, zítra část propadu vrátí. Strategie je tržně neutrální (long = short).',
    rules:['Reziduální výnos = výnos akcie − β × výnos indexu.','Long 4 nejhorších, short 4 nejlepších, rovné váhy, dolarově neutrální.','Rebalance denně. Náklady 5 bp na stranu se počítají.'],
    basics:['Tisíce malých sázek s malou hranou: zákon velkých čísel místo přesvědčení.','Tržní neutralita: výnos nezávisí na směru trhu, jen na rozptylu.','Náklady a skluz zabijí většinu stat-arb strategií. Lab je proto počítá.','Simons najímal matematiky a fyziky, ne tradery. Data a statistika místo příběhů.'],
    fund:'Nepoužívá. Čistá statistika.', senti:'Nepoužívá.',
    works:'Trhy s vysokou disperzí a krátkodobou přehnanou reakcí.', fails:'Momentum krachy a crowding (srpen 2007 „quant quake“).',
    howto:['Potřebuješ univerzum aspoň 50–500 likvidních akcií a denní data.','Každý den spočítej výnos akcie minus β × výnos indexu.','Kup decil nejhorších a shortuj decil nejlepších, rovné váhy.','Drž 1–5 dní. Simuluj realistické náklady, protože rozhodují.','Bez broker API a nízkých poplatků je to pro retail spíš studijní materiál.'] } });

DEF({ id:'pairs', name:'Párové obchodování (kointegrace)', cat:'quant', tf:'1d', mkts:'BANK/POJI, KOVO/OCEL', kind:'port',
  params:{
    look:{ v:60, min:30, max:120, step:10, label:'Okno regrese (dny)' },
    entry:{ v:2.0, min:1.25, max:3.0, step:0.25, label:'Vstup |z| ≥' },
    exit:{ v:0.25, min:0, max:1.0, step:0.25, label:'Výstup |z| ≤' },
    stopZ:{ v:4.0, min:3.0, max:6.0, step:0.5, label:'Stop |z| ≥' },
    maxHold:{ v:30, min:10, max:60, step:5, label:'Max. držení (dny)' },
    gross:{ v:1.0, min:0.5, max:2.0, step:0.25, label:'Hrubá expozice' } },
  init(){ return { pos: [0,0,0,0], since: [0,0,0,0], z: [0,0,0,0], beta: [1,1,1,1] }; },
  onBar(x, p, st){
    let changed = false; const w = {}, why = [];
    (x.W.pairs || PAIRS).forEach(([A, B], k) => {
      if (!x.W.daily[A] || !x.W.daily[B] || !x.dok(A, p.look + 1) || !x.dok(B, p.look + 1)) return;
      let sa = 0, sb = 0, sab = 0, sbb = 0; const n = p.look, la = [], lb = [];
      for (let j = 0; j < n; j++){ const a = Math.log(x.dc(A, j)), b = Math.log(x.dc(B, j)); la.push(a); lb.push(b); sa += a; sb += b; sab += a*b; sbb += b*b; }
      const ma = sa/n, mb = sb/n, cov = sab/n - ma*mb, vb = sbb/n - mb*mb, beta = vb > 0 ? cov/vb : 1;
      const sp = la.map((a, j) => a - beta*lb[j]), m = mean(sp), sd = stdev(sp), z = sd > 0 ? (sp[0] - m)/sd : 0;
      st.z[k] = z; st.beta[k] = beta; let s = st.pos[k];
      if (s === 0){ if (z > p.entry) s = -1; else if (z < -p.entry) s = 1; }
      else if (Math.abs(z) < p.exit || Math.abs(z) > p.stopZ || x.d - st.since[k] > p.maxHold) s = 0;
      if (s !== st.pos[k]){ changed = true; st.pos[k] = s; st.since[k] = x.d; why.push(A + '/' + B + ' z=' + nf(z,2) + (s === 0 ? ' → zavřít' : s > 0 ? ' → long ' + A + ', short ' + B : ' → short ' + A + ', long ' + B)); }
      const g = p.gross/2, bb = Math.abs(beta) || 1; w[A] = s*g/(1 + bb); w[B] = -s*g*bb/(1 + bb);
    });
    if (changed) x.rebalance(w, 'Páry: ' + why.join('; '));
  },
  info:{ who:'Nunzio Tartaglia a quant tým Morgan Stanley (80. léta); D. E. Shaw', src:'Gatev, Goetzmann & Rouwenhorst: „Pairs Trading“ (Review of Financial Studies, 2006)', year:2006,
    idea:'Dvě firmy ze stejného odvětví (banka a pojišťovna, strojírny a ocelárny) sdílí stejné ekonomické síly. Jejich cenový poměr kolísá kolem rovnováhy. Když se poměr extrémně rozevře, koupíš levnější a shortuješ dražší a čekáš na návrat.',
    rules:['Hedge ratio β = regrese ln(A) na ln(B) za 60 dní. Spread = ln A − β ln B.','z-skóre spreadu ≥ 2 → short A, long B. ≤ −2 → opačně.','Výstup při |z| ≤ 0,25. Stop při |z| ≥ 4 nebo po 30 dnech.'],
    basics:['Korelace není kointegrace. Páry musí mít ekonomický důvod se vracet.','Největší riziko je rozpad páru (akvizice, změna byznysu). Proto stop v z i v čase.','Tržně neutrální, a tedy nízká korelace s indexem.'],
    fund:'Výběr páru je fundamentální (stejné odvětví a podobný byznys).', senti:'Nepoužívá.',
    works:'Stabilní odvětví bez šoků.', fails:'Strukturní zlomy, kdy jedna firma má zprávu a druhá ne.',
    howto:['Najdi dvě akcie ze stejného odvětví s dlouhou společnou historií.','Otestuj kointegraci (Engle-Granger, ADF test na spread).','Spočítej z-skóre spreadu na klouzavém okně.','Vstup při |z| > 2 dolarově vyváženě podle β, výstup při návratu k 0.','Stop v z i v čase, protože pár se může rozpadnout navždy.'] } });

DEF({ id:'pead', name:'PEAD – drift po výsledcích', cat:'event', tf:'1d', mkts:'Akcie (24)', kind:'trade', minTrades:10,
  params:{
    sueMin:{ v:1.5, min:0.5, max:3.0, step:0.25, label:'Min. překvapení SUE' },
    hold:{ v:60, min:10, max:90, step:10, label:'Držení (dny)' },
    stop:{ v:0.1, min:0, max:0.2, step:0.02, label:'Stop (%, 0 = bez)' },
    shorts:{ v:true, type:'bool', label:'Shortovat negativní překvapení' },
    maxPos:{ v:8, min:8, max:8, step:1, opt:false, label:'Max. pozic' } },
  init(){ return {}; },
  onBar(x, p){
    const ev = x.events().filter(e => e.type === 'EARN'); if (!ev.length) return;
    let open = x.allLots().length;
    for (const e of ev){ if (open >= p.maxPos || x.pos(e.sym)) continue; const F = x.fund(e.sym), c = x.dc(e.sym); if (!F) continue;
      const o = { type:'close', alloc: 1/p.maxPos, maxHold: p.hold, stopPct: p.stop > 0 ? p.stop : undefined, riskRef: 0.1*c, reason: e.sym + ': překvapení ve výsledcích SUE = ' + nf(F.sue, 2) + ', EPS r/r ' + pct(F.yoyQ, 0) };
      if (F.sue >= p.sueMin){ x.buy(e.sym, o); open++; } else if (p.shorts && F.sue <= -p.sueMin){ x.sell(e.sym, o); open++; } }
  },
  info:{ who:'Ray Ball & Philip Brown (1968); Bernard & Thomas (1989)', src:'„An Empirical Evaluation of Accounting Income Numbers“ (Journal of Accounting Research, 1968)', year:1968,
    idea:'Jedna z nejstarších a nejrobustnějších anomálií. Trh na překvapení ve výsledcích nereaguje hned celou silou. Po pozitivním překvapení cena driftuje nahoru ještě ~60 dní, po negativním dolů. Analytici upravují odhady postupně a investoři informaci nedoceňují.',
    rules:['SUE = (skutečné EPS − konsenzus) / směrodatná odchylka překvapení.','Den výsledků: SUE ≥ 1,5 → long na close, SUE ≤ −1,5 → short.','Držení 60 dní, stop 10 %, max. 8 pozic po 1/8 kapitálu.'],
    basics:['Rozhoduje překvapení oproti očekávání, ne absolutní zisk.','Efekt je silnější u menších firem s menším pokrytím analytiků.','Fundamentální data musí mít správné datum (bez lookahead). Lab bere jen zveřejněné výsledky.'],
    fund:'Jádro: kvartální výsledky simulovaných firem, konsenzus a překvapení.', senti:'Zprávový sentiment akcie po výsledcích skočí. Lab ukazuje obojí.',
    works:'Výsledková sezóna, výrazná překvapení.', fails:'Když trh překvapení předem „ví“ (únik, whisper numbers).',
    howto:['Sleduj kalendář výsledků (Earnings Whispers, Nasdaq).','Po zveřejnění porovnej EPS s konsenzem a spočítej překvapení v násobcích jeho historické odchylky.','Velké pozitivní překvapení s gapem nahoru → kup na close nebo další den.','Drž ~60 dní, stop 10 %.','Kombinuj s revizemi odhadů analytiků (zvýšení = potvrzení).'] } });

DEF({ id:'senti_ls', name:'Sentiment long/short (Bloomberg)', cat:'event', tf:'1d', mkts:'Akcie (24), tržně neutrální', kind:'port', minTrade: 0.002,
  params:{ frac:{ v:0.33, min:0.15, max:0.5, step:0.05, label:'Horní/dolní podíl akcií' }, hold:{ v:1, min:1, max:10, step:1, label:'Rebalance každých (dní)' }, gross:{ v:1.0, min:0.5, max:2.0, step:0.25, label:'Hrubá expozice' } },
  init(){ return { last: -9999 }; },
  onBar(x, p, st){
    if (x.d - st.last < p.hold || x.d < 5) return; st.last = x.d;
    if (stockSyms(x).filter(s => Math.abs(x.sent(s)) > 1e-6).length < 6) return;
    const arr = stockSyms(x).map(s => ({ s, v: x.sent(s) })).sort((a,b) => b.v - a.v), k = Math.max(1, Math.round(arr.length*p.frac)), w = {};
    arr.slice(0, k).forEach(o => w[o.s] = p.gross/2/k); arr.slice(-k).forEach(o => w[o.s] = -p.gross/2/k); for (const s of stockSyms(x)) if (!(s in w)) w[s] = 0;
    x.rebalance(w, 'Long horní ' + Math.round(p.frac*100) + ' % sentimentu (' + arr.slice(0,3).map(o => o.s).join(', ') + '…), short dolní');
  },
  info:{ who:'Bloomberg Quant Research (A. Verma, L. Huang, D. Caporaletti)', src:'Bloomberg: „Embedded Value in Bloomberg News & Social Sentiment Data“; „Trading the news: use machine-readable data to find alpha“', year:2017,
    idea:'Bloomberg strojově čte zprávy a sociální sítě a každé akcii přiřadí sentiment −1 až 1 (funkce TREN na terminálu). Jejich backtesty ukázaly, že long horní třetiny a short dolní třetiny podle denního sentimentu vydělávaly. Sentiment je podle nich motor cenového momenta.',
    rules:['Před otevřením seřaď akcie podle včerejšího sentimentu.','Long horní třetina, short dolní třetina, rovné váhy, dolarově neutrální.','Rebalance denně. Lab počítá náklady 5 bp na stranu, které Bloomberg v testu ignoroval.'],
    basics:['Sentiment je krátkodobý signál. Rychle se rozpadá, a proto rozhoduje frekvence a náklady.','Bloombergův test byl bez nákladů. Realita je horší a evoluce tu často prodlouží držení.','Kvalita dat (relevance zprávy k firmě) je víc než model.'],
    fund:'Sentiment po výsledcích odráží fundamentální překvapení.', senti:'Jádro: zprávový sentiment akcií (simulovaný, s mírnou prediktivní silou).',
    works:'Akcie s častými zprávami, nízké náklady.', fails:'Vysoké náklady, rychlý rozpad signálu, šum ze sociálních sítí.',
    howto:['Zdroj sentimentu: Bloomberg TREN/EDF, RavenPack, nebo vlastní NLP nad zprávami.','Denně seřaď universum podle skóre.','Long top třetina, short spodní třetina, nebo jen long top pro retail.','Testuj s realistickými náklady a držením 1–8 dní (Bloomberg na jedné akcii zkoušel práh ±0,225 a 8 dní).'] } });

DEF({ id:'graham', name:'Graham & Buffett: hodnota + kvalita', cat:'invest', tf:'1d', mkts:'Akcie (24)', kind:'port',
  params:{
    peMax:{ v:15, min:8, max:25, step:1, label:'Max. P/E (Graham 15)' },
    deMax:{ v:1.0, min:0.3, max:2.0, step:0.1, label:'Max. dluh/kapitál' },
    roicMin:{ v:0.1, min:0.04, max:0.2, step:0.01, label:'Min. ROIC (Buffett: kvalita)' },
    fMin:{ v:6, min:4, max:8, step:1, label:'Min. F-skóre (Piotroski)' },
    mos:{ v:0.25, min:0, max:0.45, step:0.05, label:'Bezpečnostní polštář (margin of safety)' },
    maxN:{ v:8, min:4, max:12, step:1, label:'Počet akcií' },
    rebal:{ v:252, min:126, max:504, step:63, label:'Nový výběr každých (dní)' },
    sellIV:{ v:true, type:'bool', label:'Prodat při dosažení vnitřní hodnoty' } },
  init(){ return { last: -9999, held: [] }; },
  onBar(x, p, st){
    if (!x.W.cal.isMonthEnd(x.d) || x.d < 260) return;
    const iv = s => { const F = x.fund(s); return F && F.ttm > 0 ? F.ttm*(8.5 + 2*clamp(F.g, 0, 0.15)*100) : 0; };
    if (x.d - st.last >= p.rebal){
      st.last = x.d;
      const c = stockSyms(x).map(s => { const F = x.fund(s), px = x.dc(s); return { s, F, px, v: iv(s) }; })
        .filter(o => o.F && o.F.ttm > 0 && o.px/o.F.ttm <= p.peMax && o.F.de <= p.deMax && o.F.roic >= p.roicMin && o.F.fscore >= p.fMin && o.px <= (1 - p.mos)*o.v)
        .sort((a,b) => b.v/b.px - a.v/a.px).slice(0, p.maxN);
      st.held = c.map(o => o.s); const w = {}; for (const s of stockSyms(x)) w[s] = 0; for (const s of st.held) w[s] = 1/p.maxN;
      x.rebalance(w, 'Roční výběr: ' + (st.held.join(', ') || 'nic nesplnilo, hotovost') + ' (P/E ≤ ' + p.peMax + ', ROIC ≥ ' + pct(p.roicMin,0) + ', cena ≤ ' + pct(1 - p.mos,0) + ' vnitřní hodnoty)');
      return;
    }
    if (p.sellIV && st.held.length){ const sold = st.held.filter(s => x.dc(s) >= iv(s)); if (sold.length){ st.held = st.held.filter(s => !sold.includes(s)); const w = curW(x); for (const s of sold) w[s] = 0; x.rebalance(w, 'Prodej, cena dosáhla vnitřní hodnoty: ' + sold.join(', ')); } }
  },
  info:{ who:'Benjamin Graham (učitel Buffetta) a Warren Buffett (Berkshire Hathaway)', src:'The Intelligent Investor (Graham, 1949); Security Analysis (1934); dopisy akcionářům Berkshire Hathaway', year:1949,
    idea:'Akcie je podíl na skutečném podniku, ne ticker. Kupuj, když je cena výrazně pod vnitřní hodnotou (margin of safety). Buffett přidal kvalitu: radši skvělou firmu za férovou cenu než průměrnou za skvělou. Pan Trh je maniodepresivní partner, který ti každý den nabízí cenu. Nemusíš ji přijmout.',
    rules:['Grahamova vnitřní hodnota: V = EPS × (8,5 + 2g), g = očekávaný růst v % (v labu max. 15 %).','Filtr: P/E ≤ 15, dluh/kapitál ≤ 1, ROIC ≥ 10 %, Piotroski F-skóre ≥ 6.','Nákup jen při ceně ≤ 75 % vnitřní hodnoty. Až 8 akcií, rovné váhy, zbytek hotovost.','Ročně nový výběr. Prodej, když cena dosáhne vnitřní hodnoty.'],
    basics:['Margin of safety je jádro: chráníš se před vlastními chybami v odhadu.','Kvalita (vysoký ROIC, nízký dluh) brání value pasti, tedy levné akcii, která je levná právem.','Horizont v letech. Hodnota se do ceny propisuje pomalu (v labu poločas ~4–5 let).'],
    fund:'Jádro: EPS, růst, ROIC, zadlužení a F-skóre ze simulovaných kvartálních výsledků.', senti:'Kontrariánský: nejlevnější bývá to, čeho se trh bojí.',
    works:'Dlouhý horizont, návrat ocenění k průměru.', fails:'Období, kdy trh platí jen za růst (value roky 2017–2020).',
    howto:['Screener: P/E < 15, P/B < 1,5, dluh/kapitál < 1, ROE/ROIC > 10 %, 10 let ziskovosti.','Odhadni vnitřní hodnotu (Graham formule, DCF, nebo konzervativní násobek FCF).','Kupuj jen se slevou 25–35 %.','Drž, dokud cena nedosáhne hodnoty nebo se nezhorší fundamenty.','Čti výroční zprávy. Buffett: „investuj jen do toho, čemu rozumíš“.'] } });

DEF({ id:'magic', name:'Magic Formula (Greenblatt)', cat:'invest', tf:'1d', mkts:'Akcie (bez finančních a utilit)', kind:'port',
  params:{ N:{ v:8, min:4, max:12, step:1, label:'Počet akcií' }, rebal:{ v:252, min:126, max:252, step:21, label:'Rebalance každých (dní)' } },
  init(){ return { last: -9999 }; },
  onBar(x, p, st){
    if (x.d - st.last < p.rebal || x.d < 260) return; st.last = x.d;
    const c = x.W.stocks.filter(s => s.sec !== 'fin' && s.sec !== 'util').map(s => { const F = x.fund(s.sym), px = x.dc(s.sym); return F && F.ttm > 0 ? { s: s.sym, ey: F.ttm/(px*(1 + 0.5*F.de)), roc: F.roic } : null; }).filter(Boolean);
    const r1 = [...c].sort((a,b) => b.ey - a.ey), r2 = [...c].sort((a,b) => b.roc - a.roc); c.forEach(o => o.rank = r1.indexOf(o) + r2.indexOf(o)); c.sort((a,b) => a.rank - b.rank);
    const pick = c.slice(0, p.N), w = {}; for (const s of stockSyms(x)) w[s] = 0; for (const o of pick) w[o.s] = 1/p.N;
    x.rebalance(w, 'Roční výběr podle výnosu z EBIT/EV + ROIC: ' + pick.map(o => o.s).join(', '));
  },
  info:{ who:'Joel Greenblatt (Gotham Capital)', src:'The Little Book That Beats the Market (2005)', year:2005,
    idea:'Kupuj dobré firmy (vysoká návratnost kapitálu) za nízkou cenu (vysoký výnos z EBIT/EV). Seřaď akcie podle obou kritérií, sečti pořadí a kup nejlepších 20–30. Drž rok a opakuj. Greenblatt uvádí, že to v letech 1988–2004 dávalo kolem 30 % ročně.',
    rules:['Earnings yield = EBIT / EV (v labu zisk / (tržní kap. × (1 + 0,5 × dluh/kap.))).','Return on capital = ROIC.','Pořadí EY + pořadí ROC, nejlepších 8 (ze 24), rovné váhy.','Bez finančních firem a utilit. Rebalance jednou ročně.'],
    basics:['Formule je jednoduchá. Těžké je ji vydržet: roky podprůměru odradí většinu lidí.','Dvě kritéria brání value pasti (levné a špatné) i růstové bublině (skvělé a drahé).','Rovné váhy a mechanické pravidlo omezují emoce.'],
    fund:'Jádro: EBIT/EV a ROIC ze simulovaných fundamentů.', senti:'Nepoužívá (a v tom je síla).',
    works:'Horizont 3+ let.', fails:'Jednotlivé roky, kdy trh honí růst.',
    howto:['magicformulainvesting.com (zdarma) nebo vlastní screener: EBIT/EV a ROIC.','Kup 20–30 nejlepších, ideálně postupně (2–3 akcie měsíčně).','Po roce prodej a nahraď novým výběrem.','Vydrž minimálně 3–5 let, jinak strategii nedáváš šanci.'] } });

DEF({ id:'all_weather', name:'All Weather (Ray Dalio)', cat:'invest', tf:'1d', mkts:'NQ, BOND20, BOND7, GOLD, COMM', kind:'port',
  params:{ mode:{ v:'fixed', opts:['fixed','riskparity'], label:'Váhy: pevné / risk parity' }, rebal:{ v:63, min:21, max:252, step:21, label:'Rebalance každých (dní)' } },
  init(){ return { last: -9999 }; },
  onBar(x, p, st){
    if (x.d - st.last < p.rebal || !x.dok('NQ', 61)) return; st.last = x.d;
    let w; if (p.mode === 'fixed') w = { NQ: 0.30, BOND20: 0.40, BOND7: 0.15, GOLD: 0.075, COMM: 0.075 };
    else { const syms = ['NQ','BOND20','BOND7','GOLD','COMM'], iv = syms.map(s => 1/Math.max(1e-4, x.di(s,'vol',60))), t = sum(iv); w = {}; syms.forEach((s, k) => w[s] = iv[k]/t); }
    x.rebalance(w, 'Rebalance ' + (p.mode === 'fixed' ? '30/40/15/7,5/7,5' : 'risk parity'));
  },
  info:{ who:'Ray Dalio (Bridgewater Associates); zjednodušenou verzi zveřejnil Tony Robbins', src:'Money: Master the Game (T. Robbins, 2014); Bridgewater: The All Weather Story', year:2014,
    idea:'Nikdo neví, jaké přijde makro prostředí: růst, nebo recese, inflace, nebo deflace. All Weather rozdělí riziko rovnoměrně mezi čtyři „roční období“, takže portfolio přežije každé. Akcie jsou rizikovější, proto mají menší váhu a dluhopisy větší.',
    rules:['30 % akcie, 40 % dlouhé dluhopisy, 15 % střední dluhopisy, 7,5 % zlato, 7,5 % komodity.','Rebalance čtvrtletně.','Alternativa „risk parity“: váhy podle inverzní volatility.'],
    basics:['Diverzifikace podle rizika, ne podle peněz. 60/40 má ~90 % rizika v akciích.','Každé aktivum vydělává v jiném makro režimu (růst ↑ akcie, inflace ↑ zlato a komodity, deflace ↑ dluhopisy).','Nejhorší rok je situace, kdy padají akcie i dluhopisy současně (inflační šok jako 2022).'],
    fund:'Konstrukce je čistě makro (růst × inflace). Váhy fundamenty neřídí.', senti:'Nepoužívá.',
    works:'Dlouhodobě nižší drawdowny než akcie.', fails:'Rostoucí sazby a inflace, kdy padají dluhopisy i akcie.',
    howto:['ETF: VTI (30 %), TLT (40 %), IEF (15 %), GLD (7,5 %), DBC (7,5 %).','Rebalancuj čtvrtletně nebo při odchylce > 5 %.','Nečekej výnos akcií. Čekej klidnější spánek.','Pochop, proč tam je každé aktivum, jinak ho v krizi prodáš.'] } });

DEF({ id:'bogle', name:'Bogle 60/40 + rada Tuchmana', cat:'invest', tf:'1d', mkts:'NQ, WORLD, BOND7', kind:'port',
  params:{ eq:{ v:0.6, min:0.3, max:0.9, step:0.1, label:'Podíl akcií' }, rebal:{ v:252, min:63, max:504, step:63, label:'Kalendářní rebalance (dny)' }, band:{ v:0.05, min:0.02, max:0.15, step:0.01, label:'Rebalance při odchylce >' } },
  init(){ return { last: -9999 }; },
  onBar(x, p, st){
    if (!x.dok('NQ', 2)) return;
    const tgt = { NQ: p.eq/2, WORLD: p.eq/2, BOND7: 1 - p.eq };
    const cw = curW(x, Object.keys(tgt)), eqNow = (cw.NQ || 0) + (cw.WORLD || 0);
    if (x.d - st.last >= p.rebal || Math.abs(eqNow - p.eq) > p.band){ st.last = x.d; x.rebalance(tgt, 'Rebalance na ' + Math.round(p.eq*100) + '/' + Math.round((1-p.eq)*100) + ' (akcie teď ' + pct(eqNow,0) + ')'); }
  },
  info:{ who:'John C. Bogle (zakladatel Vanguard, otec indexových fondů); Peter Tuchman („Einstein of Wall Street“, NYSE)', src:'The Little Book of Common Sense Investing (Bogle, 2007)', year:2007,
    idea:'Většina aktivních manažerů po nákladech dlouhodobě nepřekoná index. Kup celý trh levně, rozlož akcie a dluhopisy a nech složené úročení pracovat. Peter Tuchman, nejfotografovanější makléř na parketu NYSE (v médiích „Einstein of Wall Street“), radí mladým v podobném duchu: investuj do akcií, ne do věcí.',
    rules:['60 % akcie (polovina US, polovina svět), 40 % dluhopisy.','Rebalance jednou ročně, nebo když se akcie odchýlí o víc než 5 bodů.','Žádné časování trhu.'],
    basics:['Náklady jsou jediná jistota. Každé 1 % ročně ti za 30 let sebere ~25 % majetku.','Čas na trhu > časování trhu.','Rebalance automaticky prodává drahé a kupuje levné.'],
    fund:'Nepoužívá. Kupuješ celou ekonomiku.', senti:'Ignoruje ho záměrně. To je jeho výhoda.',
    works:'Vždy dlouhodobě, pro většinu lidí nejlepší volba.', fails:'Krátkodobě v krizích (−30 %). Prodávat v panice je jediná skutečná chyba.',
    howto:['Otevři účet u levného brokera, vyber 2–3 ETF (např. VWCE / světové akcie + dluhopisy).','Nastav pravidelnou měsíční investici (DCA).','Jednou ročně rebalancuj na cílové váhy.','Podíl akcií podle horizontu a nervů, ne podle zpráv.','Tuchmanova rada: peníze dej do podílů ve firmách, které dělají věci, ne do věcí.'] } });

DEF({ id:'ib_break', name:'Initial Balance breakout (Market Profile)', cat:'intraday', tf:'5m', mkts:'NQ', kind:'trade', risk:0.005, minTrades:6,
  params:{
    ibMax:{ v:0.45, min:0.2, max:0.8, step:0.05, label:'Max. šířka IB (× denní ATR)' },
    ext:{ v:1.0, min:0.5, max:2.0, step:0.25, label:'Cíl: prodloužení IB (× šířka IB)' },
    stopMode:{ v:'mid', opts:['mid','opp'], label:'Stop: střed IB / druhá strana' },
    expiry:{ v:840, opts:[720,780,840,900], label:'Příkazy platí do (NY)' },
    shorts:{ v:true, type:'bool', label:'Obchodovat i průraz dolů' } },
  init(){ return { day:-1 }; },
  onBar(x, p, st){
    if (st.day !== x.d){ st.day = x.d; st.placed = false; }
    if (st.placed || x.t !== 630) return; st.placed = true;
    let hi = -Infinity, lo = Infinity; for (let k = 0; k < 12; k++){ if (!x.ok(k)) return; hi = Math.max(hi, x.h(k)); lo = Math.min(lo, x.l(k)); }
    if (!x.dok('NQ', 15)) return; const atr = x.di('NQ', 'atr', 14, 1), w = hi - lo; if (!(atr > 0) || !(w > 0) || w > p.ibMax*atr) return;
    const mid = (hi + lo)/2, exp = x.j + (p.expiry - 630), oco = 'ib' + x.d;
    x.buy({ type:'stop', price: hi + NQ_TICK, stop: p.stopMode === 'mid' ? mid : lo - NQ_TICK, target: hi + p.ext*w, exp, oco, flat: 955, reason: 'Úzký Initial Balance (' + nf(w/atr, 2) + ' × ATR), průraz nahoru' });
    if (p.shorts) x.sell({ type:'stop', price: lo - NQ_TICK, stop: p.stopMode === 'mid' ? mid : hi + NQ_TICK, target: lo - p.ext*w, exp, oco, flat: 955, reason: 'Úzký Initial Balance (' + nf(w/atr, 2) + ' × ATR), průraz dolů' });
  },
  info:{ who:'J. Peter Steidlmayer (CBOT) a James Dalton', src:'Mind Over Markets (J. Dalton, 1990); Market Profile CBOT', year:1990,
    idea:'Initial Balance je rozpětí první hodiny obchodování (9:30–10:30 NY). Když je úzké, velcí hráči se ještě nerozhodli a den často „vyrazí“ jedním směrem. Průraz IB pak bývá začátek trendového dne a cena často urazí ještě jednu šířku IB.',
    rules:['V 10:30 NY se změří high a low první hodiny (IB).','Obchoduje se jen úzký IB: šířka nejvýš 0,45 × denní ATR(14). Široký IB znamená spíš range den.','Buy stop nad IB high, sell stop pod IB low (OCO).','Stop na středu IB, cíl jedno prodloužení IB (1 × šířka). Vše se zavírá v 15:55.'],
    basics:['Dalton dělí dny podle IB: úzký IB = šance na trendový den, široký IB = rotace v rozpětí.','Většina dní IB nakonec aspoň jednou prorazí, ale skutečný trend přijde jen někdy. Proto je důležitý cíl a stop.','Funguje nejlíp v kombinaci s kontextem: kde je cena vůči včerejší value area.'],
    fund:'Nepoužívá přímo. Dny se zprávou v 10:00 (ISM) mohou IB rozbít předčasně.', senti:'Kontext jde do EV filtru, lab se učí, ve kterém prostředí průraz IB vydrží.',
    works:'Trendové dny po klidném ránu, dny po kompresi.', fails:'Dny s falešným průrazem a návratem do IB (tzv. failed auction).',
    howto:['Na grafu NQ 5m si v 10:30 NY (Praha 16:30) označ high a low první hodiny.','Porovnej šířku s denním ATR(14). Když je IB užší než asi polovina ATR, je den kandidát.','Zadej buy stop 1 tick nad IB high a sell stop 1 tick pod IB low jako OCO.','Stop na středu IB, cíl o jednu šířku IB dál.','Nevyplněné příkazy zruš ve 14:00 NY, otevřenou pozici zavři před koncem dne.'] } });

DEF({ id:'overnight', name:'Overnight drift (noční výnos)', cat:'quant', tf:'5m', mkts:'NQ', kind:'trade', risk:0.01, minTrades:10,
  params:{
    stopAtr:{ v:1.0, min:0.5, max:2.0, step:0.1, label:'Stop (× denní ATR)' },
    trend:{ v:true, type:'bool', label:'Jen nad SMA denní' },
    trendLen:{ v:100, min:20, max:200, step:10, label:'Délka SMA' },
    noFri:{ v:true, type:'bool', label:'Nedržet přes víkend' } },
  init(){ return {}; },
  onBar(x, p){
    const L = x.pos();
    if (L){ if (x.d !== L.eD && x.t === 575) x.exit(L, 'TIME'); return; }
    if (x.t !== 955 || x.orders().length || !x.dok('NQ', p.trendLen + 2)) return;
    if (p.noFri && x.W.cal.get(x.d).wd === 5) return;
    if (p.trend && x.dc('NQ', 1) < x.di('NQ', 'sma', p.trendLen, 1)) return;
    const atr = x.di('NQ', 'atr', 14, 1); if (!(atr > 0)) return;
    x.buy({ stop: x.c() - p.stopAtr*atr, reason: 'Nákup v 15:55 NY, prodej po otevření 9:35: noční prémie' });
  },
  info:{ who:'Cliff, Cooper & Gulen; Kelly & Clark', src:'„Return differences between trading and non-trading hours“ (M. Cliff, M. Cooper, H. Gulen, 2008)', year:2008,
    idea:'Studie opakovaně ukazují, že velká část výnosu amerických akcií vzniká přes noc, mezi zavřením a otevřením, a ne během dne. Strategie proto drží NQ jen přes noc a přes den je v hotovosti.',
    rules:['Nákup v 15:55 NY (Praha 21:55).','Prodej druhý den v 9:35 NY po otevření.','Jen když je trh nad denní SMA100 (býčí režim). Přes víkend se nedrží.','Stop 1 × denní ATR(14) jako pojistka proti nočnímu šoku.'],
    basics:['Noční výnos je jedna z nejstabilnějších anomálií, ale ne každý rok.','Riziko je mezera při otevření: stop se v noci může vyplnit hůř.','Poplatky a skluz se platí každý den, proto rozhoduje levná exekuce.'],
    fund:'Nepoužívá přímo. Výsledky firem po zavření trhu dělají největší noční pohyby.', senti:'Kontext jde do EV filtru: lab zjišťuje, v jakém sentimentu noc vydělává.',
    works:'Býčí trhy, období klidu.', fails:'Noční šoky (geopolitika, výsledky firem), medvědí trhy.',
    howto:['Každý obchodní den v 15:55 NY zkontroluj, jestli je NQ nad SMA100 na denním grafu.','Pokud ano, kup NQ (nebo MNQ) těsně před zavřením.','Nastav stop 1 × denní ATR pod vstup.','Ráno v 9:35 NY pozici prodej, ať se stalo cokoli.','V pátek nekupuj, víkend je zbytečné riziko.'] } });

DEF({ id:'ttm_squeeze', name:'TTM Squeeze (John Carter)', cat:'swing', tf:'1d', mkts:'NQ', kind:'trade', risk:0.01, minTrades:8,
  params:{
    kc:{ v:1.5, min:1.0, max:2.5, step:0.25, label:'Keltner šířka (× ATR)' },
    minSq:{ v:5, min:2, max:15, step:1, label:'Min. dnů ve squeeze' },
    stopAtr:{ v:2.0, min:1.0, max:3.5, step:0.25, label:'Stop (× ATR)' },

function journalRows(){
  const f = UI.jf, S = UI.lab.eng.S; let all = [];
  for (const id in S){ const d = S[id].def; if (f.sid !== 'all' && f.sid !== id) continue; if (f.cat !== 'all' && d.cat !== f.cat) continue; if (!f.port && d.kind === 'port' && f.sid === 'all') continue; for (const t of S[id].acc.trades) all.push(t); }
  all = all.filter(t => (f.shadow || !t.shadow) && (f.res === 'all' || (f.res === 'win' ? t.pnl > 0 : t.pnl <= 0)));
  all.sort((a, b) => (b.xD - a.xD) || ((b.xK || 0) - (a.xK || 0)) || (b.id - a.id));
  return all;
}

/* ---------- Základy ---------- */
function rorSim(p, b, r, n){
  let ruin = 0, ends = []; const rng = makeRng(7);
  for (let k = 0; k < 2000; k++){ let e = 1, pk = 1, dead = false; for (let q = 0; q < n; q++){ e *= rng() < p ? 1 + r*b : 1 - r; pk = Math.max(pk, e); if (e < pk*0.5){ dead = true; } } if (dead) ruin++; ends.push(e); }
  ends.sort((a, b) => a - b); return { ruin: ruin/2000, med: ends[1000], p5: ends[100] };
}

function kellyCalc(){

/* ---------- Upozornění (toasty) ---------- */
function toast(html, kind){
  let box = document.getElementById('toasts'); if (!box){ box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.innerHTML = html; box.appendChild(t);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 6500);
}
const TST = { tid: null, evo: null };
function afterTick(){
  const lab = UI.lab; if (!lab) return; const f = lab.eng.feed, last = f.length ? f[f.length - 1].id : 0, ev = lab.eng.evoLog.length;
  const calm = lab.live || (UI.running && UI.speed <= 360);
  if (TST.tid === null){ TST.tid = last; TST.evo = ev; }
  if (PREF.toasts && calm){
    const fresh = f.filter(t => t.id > TST.tid && DEFS[t.sid] && !t.shadow).slice(-2);
    for (const t of fresh){ const R = t.R !== undefined ? t.R : null; toast('<span class="grade ' + t.review.grade + '">' + t.review.grade + '</span><div><b>' + esc(DEFS[t.sid].name) + '</b><br>' + (t.side > 0 ? 'Long ' : 'Short ') + t.sym + ' uzavřen ' + (R !== null ? '<b class="' + (R >= 0 ? 'good' : 'bad') + '">' + fR(R) + '</b>' : '') + '</div>', R !== null && R >= 0 ? 'win' : 'loss'); }
    for (const l of lab.eng.evoLog.slice(TST.evo)) if (l.accepted) toast('<span class="ti">🧬</span><div><b>' + esc(DEFS[l.sid].name) + '</b><br>Evoluce přijala nové parametry (gen. ' + (l.gen + 1) + ')</div>', 'evo');
  }
  TST.tid = last; TST.evo = ev;
  if (UI.view === 'prehled') setH('hero', heroHtml());
}

  const m = modal('<input type="search" id="pal-q" class="bigsearch" placeholder="Hledej strategii, stránku nebo pojem…" aria-label="Hledat" autocomplete="off"><div id="pal-l" class="pal"></div><div class="muted" style="font-size:12px;margin-top:8px">↑ ↓ vybrat · Enter otevřít · Esc zavřít</div>', 'top');
  const items = [['🏠','Přehled','#prehled'],['📚','Všechny strategie','#strategie'],['🧭','Najdi svou strategii (kvíz)','#kviz'],['📒','Deník obchodů','#obchody'],['🕯️','Trh a data','#trh'],['🧬','Evoluce strategií','#evoluce'],['🧠','Základy a psychologie','#zaklady'],['🌳','Dlouhodobé investování','#investice'],['📖','Slovníček pojmů','#slovnik'],['🧮','Kalkulačky','#nastroje'],['📂','Test na vlastních datech','#data'],['⚙️','Nastavení a mozek','#nastaveni']]
    .map(([i, t, h]) => ({ i, t, h, s: 'stránka' })).concat(STRATS.filter(d => !d.bench).map(d => ({ i: CAT_ICON[d.cat], t: d.name, h: '#s-' + hid(d.id), s: CATS[d.cat].name + (isFav(d.id) ? ' · ★' : '') + ' · ' + d.info.who }))).concat(GLOSS.map(g => ({ i: '📖', t: g.t, h: '#slovnik', s: g.s, g: g.t })));
  let sel = 0, cur = items;
  const draw = () => { const q = norm(document.getElementById('pal-q').value); cur = items.filter(x => !q || norm(x.t + ' ' + x.s).includes(q)).slice(0, 9); sel = Math.min(sel, Math.max(0, cur.length - 1));
    document.getElementById('pal-l').innerHTML = cur.length ? cur.map((x, k) => '<a href="' + x.h + '" class="' + (k === sel ? 'on' : '') + '" data-act="palgo" data-g="' + esc(x.g || '') + '"><span class="pi">' + x.i + '</span><span><b>' + esc(x.t) + '</b><small>' + esc(x.s).slice(0, 90) + '</small></span></a>').join('') : '<p class="muted">Nic nenalezeno.</p>'; };
  const q = document.getElementById('pal-q'); q.addEventListener('input', () => { sel = 0; draw(); });
  q.addEventListener('keydown', e => { if (e.key === 'ArrowDown'){ sel = Math.min(cur.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp'){ sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter' && cur[sel]){ if (cur[sel].g) UI.gq = cur[sel].g; location.hash = cur[sel].h; closeModal(); if (cur[sel].h === '#slovnik' && UI.view === 'slovnik') renderView(); } });
  draw();
}
function keysHelp(){
  modal('<h2>⌨️ Klávesové zkratky</h2><div class="keys">' + [['/','Hledat cokoli'],['Ctrl/⌘ + K','Hledat cokoli'],['?','Tahle nápověda'],['T','Světlý / tmavý režim'],['+ / −','Větší / menší písmo'],['G pak P','Přehled'],['G pak S','Všechny strategie'],['G pak K','Kvíz'],['Esc','Zavřít okno']].map(([k, l]) => '<div><kbd>' + k + '</kbd><span>' + l + '</span></div>').join('') + '</div><div class="tnav"><button class="btn primary" data-act="close">Rozumím</button></div>');
}

/* ---------- Ovládání ---------- */
function setFs(v){ PREF.fs = clamp(v, 85, 140); savePref(); const a = document.querySelector('.lapp'); if (a) a.style.zoom = PREF.fs/100; const b = document.getElementById('fsbtn'); if (b) b.title = 'Velikost písma ' + PREF.fs + ' %'; if (UI.lab) setTimeout(() => VIEWS[UI.view].update(UI.arg, true), 50); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, k = el.dataset.k;
  switch (a){
    case 'fav': { e.preventDefault(); e.stopPropagation(); const i = PREF.fav.indexOf(k); if (i >= 0) PREF.fav.splice(i, 1); else PREF.fav.push(k); savePref(); toast('<span class="ti">' + (i >= 0 ? '☆' : '⭐') + '</span><div>' + esc(DEFS[k].name) + (i >= 0 ? ' odebrána z oblíbených' : ' přidána do oblíbených') + '</div>', 'evo'); renderView(); break; }
    case 'simple': PREF.simple = !PREF.simple; savePref(); renderView(); break;
    case 'lib': { const [kk, v] = k.split(':'); PREF[kk] = kk === 'lv' ? +v : v; savePref(); renderView(); break; }
    case 'quiz': { const Q = UI.quiz; if (k === 'restart'){ Q.step = 0; Q.ans = {}; } else if (k === 'back') Q.step = Math.max(0, Q.step - 1); else { const [kk, v] = k.split(':'); Q.ans[kk] = isNaN(+v) ? v : +v; Q.step++; } renderView(); window.scrollTo({ top: 0, behavior: 'smooth' }); break; }
    case 'tour': tour(k ? +k : 0); break;
    case 'keys': keysHelp(); break;
    case 'close': closeModal(); break;
    case 'palgo': if (el.dataset.g){ UI.gq = el.dataset.g; } closeModal(); if (el.getAttribute('href') === '#slovnik' && UI.view === 'slovnik') setTimeout(renderView, 0); break;
    case 'mc': UI.calc.seed++; calcAll(true); break;
    case 'jump': { const t = document.getElementById(k), d = t && t.closest('details'); if (d && !d.open){ d.open = true; } break; }
    case 'search': palette(); break;
    case 'fs': setFs(PREF.fs >= 125 ? 100 : PREF.fs + 12.5); break;
    case 'toasts': PREF.toasts = !PREF.toasts; savePref(); el.textContent = PREF.toasts ? '🔔' : '🔕'; el.title = PREF.toasts ? 'Upozornění na obchody zapnutá' : 'Upozornění vypnutá'; toast('<span class="ti">' + (PREF.toasts ? '🔔' : '🔕') + '</span><div>Upozornění na nové obchody ' + (PREF.toasts ? 'zapnuta' : 'vypnuta') + '</div>'); break;
  }
}, true);
document.addEventListener('input', e => { if (e.target.id === 'g-q'){ UI.gq = e.target.value; VIEWS.slovnik.update(null, true); } else if (e.target.id && e.target.id.startsWith('c-')) calcAll(['c-mcN','c-mcR','c-rr','c-wr'].includes(e.target.id)); });
document.addEventListener('change', e => { if (e.target.id === 'c-ins') calcAll(false); });
document.addEventListener('toggle', e => { if (e.target.id === 'adv'){ PREF.adv = e.target.open; savePref(); if (e.target.open && UI.lab) VIEWS[UI.view].update(UI.arg, true); } }, true);
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-g]'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-g]')) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-g]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, true);
let gPend = 0;
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape'){ closeModal(); hideTip(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); palette(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || document.getElementById('modal')) return;
  const k = e.key.toLowerCase();
  if (k === '/'){ e.preventDefault(); palette(); }
  else if (k === '?'){ keysHelp(); }
  else if (k === 't'){ const b = document.getElementById('themebtn'); if (b) b.click(); }
  else if (k === '+' || k === '='){ setFs(PREF.fs + 7.5); }
  else if (k === '-'){ setFs(PREF.fs - 7.5); }
  else if (k === 'g'){ gPend = Date.now(); }
  else if (Date.now() - gPend < 1200){ const map = { p: 'prehled', s: 'strategie', k: 'kviz', o: 'obchody', t: 'trh', e: 'evoluce', n: 'nastroje' }; if (map[k]) location.hash = map[k]; gPend = 0; }
});

/* ---------- Horní lišta: hledání, písmo, upozornění ---------- */
(function topbar(){
  const ctrl = document.querySelector('.ltop .ctrl'); if (!ctrl) return;
  const s = document.createElement('button'); s.className = 'sbtn'; s.dataset.act = 'search'; s.innerHTML = '🔍 <span>Hledat</span> <kbd>/</kbd>'; s.setAttribute('aria-label', 'Hledat strategie a pojmy'); ctrl.insertBefore(s, ctrl.firstChild);
  const th = document.getElementById('themebtn');
  const t = document.createElement('button'); t.className = 'themebtn'; t.dataset.act = 'toasts'; t.textContent = PREF.toasts ? '🔔' : '🔕'; t.title = 'Upozornění na nové obchody'; t.setAttribute('aria-label', 'Zapnout nebo vypnout upozornění');
  const f = document.createElement('button'); f.className = 'themebtn'; f.id = 'fsbtn'; f.dataset.act = 'fs'; f.textContent = 'A+'; f.style.fontWeight = '700'; f.style.fontSize = '13px'; f.setAttribute('aria-label', 'Zvětšit písmo');
  if (th){ ctrl.insertBefore(t, th); ctrl.insertBefore(f, th); } else { ctrl.appendChild(t); ctrl.appendChild(f); }
  const sk = document.createElement('a'); sk.href = '#view'; sk.className = 'skip'; sk.textContent = 'Přeskočit na obsah'; sk.addEventListener('click', e => { e.preventDefault(); const v = document.getElementById('view'); v.tabIndex = -1; v.focus(); }); document.body.insertBefore(sk, document.body.firstChild);
  if (PREF.fs !== 100) setFs(PREF.fs);
})();
{ const P0 = VIEWS.prehled.render; let first = true; VIEWS.prehled.render = function(a){ const h = P0.call(this, a); if (first){ first = false; if (!PREF.onboard) setTimeout(() => tour(0), 600); } return h; }; }

boot();

})();

</script>
