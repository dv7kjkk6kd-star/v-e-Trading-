name: Strategy Lab – data
on:
  schedule:
    - cron: "7,22,37,52 * * * 0-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lab-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola času (NQ se obchoduje neděle 18:00 – pátek 17:00 NY)
        id: t
        env:
          EVENT: ${{ github.event_name }}
        run: |
          D=$(TZ=America/New_York date +%u); H=$(TZ=America/New_York date +%H%M)
          R=yes
          if [ "$EVENT" != "workflow_dispatch" ]; then
            if [ "$D" = "6" ]; then R=no; fi
            if [ "$D" = "7" ] && [ "$H" -lt 1800 ]; then R=no; fi
            if [ "$D" = "5" ] && [ "$H" -gt 1730 ]; then R=no; fi
          fi
          echo "run=$R" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.t.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Instalace
        if: steps.t.outputs.run == 'yes'
        run: pip install "yfinance>=0.2.40" "pandas>=2.0"
      - name: Stažení dat
        if: steps.t.outputs.run == 'yes'
        run: python fetch_lab.py
      - name: Uložení
        if: steps.t.outputs.run == 'yes'
        run: |
          git config user.name "lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lab/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Strategy Lab: data"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 7; done
          exit 1
